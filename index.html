<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ИнфоЛаб — Основы работы с информацией</title>
<style>
:root{
  --bg:#0f1115; --surface:#171a21; --surface-2:#1e222b; --surface-3:#252a36;
  --text:#e6e8ee; --muted:#9aa3b2;
  --accent:#5b8cff; --accent-soft:#2a3550;
  --success:#4ade80; --warn:#fbbf24; --danger:#f87171;
  --radius:12px;
  --font: system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);line-height:1.55;min-height:100vh}
.app-header{display:flex;align-items:center;gap:16px;padding:12px 22px;background:var(--surface);border-bottom:1px solid #232735;position:sticky;top:0;z-index:10;flex-wrap:wrap}
.logo{font-weight:700;font-size:18px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{background:transparent;border:none;color:var(--muted);padding:8px 12px;border-radius:8px;cursor:pointer;font-size:14px;transition:.2s;font-family:inherit}
.tabs button:hover{color:var(--text);background:var(--surface-2)}
.tabs button.active{color:var(--text);background:var(--accent-soft)}
.user-badge{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.user-name{background:var(--surface-2);padding:5px 12px;border-radius:999px;font-size:13px;cursor:pointer}
.user-name:hover{background:var(--accent-soft)}
.xp-badge{background:var(--accent-soft);padding:5px 12px;border-radius:999px;font-weight:600;font-size:13px}
main{padding:28px 22px;max-width:1100px;margin:0 auto}
h1,h2,h3{line-height:1.25;margin-bottom:12px}
h1{font-size:26px;margin-bottom:16px}
h2{font-size:20px}
h3{font-size:17px}
p{margin-bottom:10px}
.muted{color:var(--muted)}
.btn{background:var(--accent);border:none;color:#fff;padding:10px 18px;border-radius:8px;cursor:pointer;font-weight:600;font-family:inherit;font-size:15px;transition:.15s}
.btn:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-ghost{background:transparent;border:1px solid #2a3140;color:var(--text)}
.btn-ghost:hover{background:var(--surface-2);filter:none}
.btn-success{background:var(--success);color:#0a1a0f}
.btn-danger{background:var(--danger);color:#2a0a0a}
.btn-sm{padding:6px 12px;font-size:13px}
.module{background:var(--surface);border:1px solid #232735;border-radius:var(--radius);padding:22px;margin-bottom:20px}
.module-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.badge-done{background:rgba(74,222,128,.15);color:var(--success);padding:4px 10px;border-radius:999px;font-size:13px;white-space:nowrap}
.badge-xp{background:rgba(91,140,255,.15);color:var(--accent);padding:4px 10px;border-radius:999px;font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-bottom:16px}
.flip-card{perspective:1000px;height:160px;cursor:pointer}
.flip-inner{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flip-card.flipped .flip-inner{transform:rotateY(180deg)}
.flip-front,.flip-back{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;padding:14px;display:flex;align-items:center;justify-content:center;text-align:center;border:1px solid #232735;overflow:auto}
.flip-front{background:var(--surface-2);font-weight:600}
.flip-back{background:var(--accent-soft);transform:rotateY(180deg);font-size:14px}
.practice-stage{background:var(--surface);border:1px solid #232735;border-radius:var(--radius);padding:22px;margin-top:20px}
.task-text{font-size:16px;margin:10px 0 16px}
input[type=text],select,textarea{width:100%;padding:12px 14px;background:var(--surface-2);border:1px solid #2a3140;border-radius:8px;color:var(--text);font-family:inherit;font-size:15px;margin-bottom:10px}
input[type=text]:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
textarea{min-height:80px;resize:vertical}
.hints{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;font-size:13px;color:var(--muted);align-items:center}
.hints code{background:var(--surface-2);padding:2px 8px;border-radius:6px;color:var(--accent);cursor:pointer}
.hints code:hover{background:var(--accent-soft)}
.result{margin-top:16px;padding:16px;background:var(--surface-2);border-radius:8px}
.score-big{font-size:32px;font-weight:700;color:var(--accent);margin-bottom:10px}
.score-big.good{color:var(--success)}
.score-big.mid{color:var(--warn)}
.score-big.bad{color:var(--danger)}
.result ul{list-style:none}
.result li{padding:3px 0;font-size:14px}
.hint{margin-top:10px;font-size:14px;color:var(--muted)}
.hint code{background:var(--bg);padding:2px 8px;border-radius:6px;color:var(--accent)}
.task-progress{background:var(--surface-2);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:13px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.task-progress b{color:var(--accent)}
.options-list{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.options-list button{background:var(--surface-2);border:1px solid #2a3140;color:var(--text);padding:12px 14px;border-radius:8px;cursor:pointer;font-size:14px;font-family:inherit;text-align:left;transition:.15s}
.options-list button:hover:not(:disabled){border-color:var(--accent);background:var(--surface-3)}
.options-list button:disabled{cursor:default}
.options-list button.chosen{border-color:var(--accent);background:var(--accent-soft)}
.options-list button.correct{border-color:var(--success);background:rgba(74,222,128,.15)}
.options-list button.wrong{border-color:var(--danger);background:rgba(248,113,113,.15)}
.radio-list{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.radio-list label{background:var(--surface-2);padding:12px 14px;border-radius:8px;cursor:pointer;font-size:14px;display:flex;gap:10px;align-items:flex-start;transition:.15s}
.radio-list label:hover{background:var(--surface-3)}
.radio-list input{margin-top:3px;flex-shrink:0}
.check-list{list-style:none;margin:12px 0}
.check-list li{background:var(--surface-2);border:1px solid #2a3140;border-radius:8px;padding:10px 14px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start;cursor:pointer;transition:.15s;font-size:14px}
.check-list li:hover{border-color:var(--accent)}
.check-list li.selected{background:var(--accent-soft);border-color:var(--accent)}
.check-list li.correct{background:rgba(74,222,128,.15);border-color:var(--success)}
.check-list li.wrong{background:rgba(248,113,113,.15);border-color:var(--danger)}
.check-list .box{width:20px;height:20px;border:2px solid #2a3140;border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;margin-top:1px}
.check-list li.selected .box{background:var(--accent);border-color:var(--accent);color:#fff}
.check-list li.correct .box{background:var(--success);border-color:var(--success);color:#0a1a0f}
.check-list li.wrong .box{background:var(--danger);border-color:var(--danger);color:#fff}
.text-block{background:var(--surface-2);border-radius:8px;padding:16px;font-size:15px;line-height:1.7;margin-bottom:14px}
.click-sentence{cursor:pointer;padding:2px 3px;border-radius:4px;transition:.15s;display:inline}
.click-sentence:hover{background:var(--surface-3)}
.click-sentence.selected{background:rgba(91,140,255,.3);box-shadow:0 0 0 1px var(--accent)}
.click-sentence.correct{background:rgba(74,222,128,.25);box-shadow:0 0 0 1px var(--success)}
.click-sentence.wrong{background:rgba(248,113,113,.25);box-shadow:0 0 0 1px var(--danger)}
.mono-visual{background:#fff;color:#111;border-radius:8px;padding:18px;margin:10px 0;font-family:'Courier New',monospace;font-size:13px;white-space:pre;overflow:auto;line-height:1.5}
.info-card{background:var(--surface-2);border-radius:10px;padding:16px;margin-bottom:12px}
.info-card h4{margin-bottom:8px;color:var(--accent);font-size:15px}
.info-card .meta{font-size:13px;color:var(--muted);margin-bottom:6px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.progress-bar{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden;margin:10px 0}
.progress-bar>div{height:100%;background:linear-gradient(90deg,var(--accent),#8b5bff);transition:width .5s}
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:12px}
.badge{background:var(--surface-2);border:1px solid #232735;border-radius:10px;padding:14px;text-align:center;opacity:.35;transition:.3s}
.badge.earned{opacity:1;border-color:var(--accent);background:linear-gradient(180deg,var(--surface-2),var(--accent-soft))}
.badge .emoji{font-size:28px;margin-bottom:6px}
.badge .name{font-size:13px;font-weight:600}
.badge .desc{font-size:11px;color:var(--muted);margin-top:4px}
.toast{position:fixed;bottom:24px;right:24px;background:var(--accent);color:#fff;padding:12px 18px;border-radius:8px;animation:slideUp .3s;z-index:100;font-weight:600}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.history-table{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
.history-table th,.history-table td{text-align:left;padding:8px 10px;border-bottom:1px solid #232735}
.history-table th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.history-table .good{color:var(--success)}
.history-table .mid{color:var(--warn)}
.history-table .bad{color:var(--danger)}
.history-empty{color:var(--muted);font-style:italic;padding:16px 0}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
.modal{background:var(--surface);border:1px solid #232735;border-radius:var(--radius);padding:26px;max-width:420px;width:100%}
.modal .actions{display:flex;gap:8px;margin-top:14px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:14px}
.stat-card{background:var(--surface-2);border-radius:10px;padding:14px;text-align:center}
.stat-card .num{font-size:24px;font-weight:700;color:var(--accent)}
.stat-card .num.good{color:var(--success)}
.stat-card .num.bad{color:var(--danger)}
.stat-card .lbl{font-size:12px;color:var(--muted);margin-top:4px}
.theory-intro{font-size:15px;line-height:1.7;background:var(--surface-2);border-left:3px solid var(--accent);padding:12px 16px;border-radius:0 8px 8px 0;margin-bottom:20px}
.theory-subtitle{font-size:16px;font-weight:700;margin:20px 0 10px;color:var(--text)}
.theory-section{margin:18px 0;padding:16px 18px;background:var(--surface-2);border-radius:10px;border:1px solid #232735}
.theory-section.tips{background:rgba(91,140,255,.06);border-color:rgba(91,140,255,.25)}
.theory-section.mistakes{background:rgba(251,191,36,.06);border-color:rgba(251,191,36,.25)}
.theory-section.it{background:rgba(74,222,128,.06);border-color:rgba(74,222,128,.25)}
.theory-body{font-size:14.5px;line-height:1.7}
.theory-body p{margin-bottom:10px}
.theory-list{list-style:none;padding:0}
.theory-list li{position:relative;padding:6px 0 6px 22px;font-size:14.5px}
.theory-list li::before{content:'›';position:absolute;left:6px;top:5px;color:var(--accent);font-weight:700;font-size:16px}
.quiz-block{margin-top:14px;padding:16px;background:var(--surface-2);border-radius:8px}
.quiz-q{margin:14px 0}
.quiz-q label{display:block;padding:8px 10px;cursor:pointer;border-radius:6px;transition:.15s}
.quiz-q label:hover{background:var(--surface-3)}
.quiz-q input{margin-right:8px}
.exam-dot{width:22px;height:22px;border-radius:50%;background:var(--surface-2);border:1px solid #2a3140;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--muted)}
.exam-dot.current{background:var(--accent);color:#fff;border-color:var(--accent)}
.exam-dot.done{background:var(--success);color:#0a1a0f;border-color:var(--success)}
@media(max-width:600px){}
@media print{
  body{background:#fff;color:#111;font-size:12px}
  .app-header,.tabs,.toast,.no-print,.btn,.btn-ghost,button{display:none !important}
  main{padding:0;max-width:100%}
  .module,.practice-stage,.history-table,.stat-card,.theory-section{background:#fff;border:1px solid #ccc;page-break-inside:avoid;margin-bottom:14px}
  h1,h2,h3{color:#000}
}
</style>
</head>
<body>

<header class="app-header no-print">
  <div class="logo">🧠 ИнфоЛаб</div>
  <nav class="tabs">
    <button data-view="home">Главная</button>
    <button data-view="theory">Теория</button>
    <button data-view="practice">Практика</button>
    <button data-view="profile">Профиль</button>
  </nav>
  <div class="user-badge">
    <div class="user-name" id="user-name-btn" title="Изменить ФИО">👤 Гость</div>
    <div class="xp-badge">XP: <span id="xp-value">0</span></div>
  </div>
</header>

<main id="app"></main>

<script>
/* ============================================================
   1. ДАННЫЕ
   ============================================================ */

const THEORY_DATA = {
  modules: [
    {
      id: 'm1',
      title: '1. Информация и её свойства',
      intro: 'Информация — базовое понятие дисциплины. От того, как мы её определяем, зависит всё остальное: как искать, как оценивать, как использовать. В этом модуле разберёмся, чем данные отличаются от информации, и какие свойства делают информацию ценной.',
      cards: [
        { term: 'Информация', definition: 'Сведения об объектах и явлениях, уменьшающие неопределённость у получателя.' },
        { term: 'Данные', definition: 'Сырые факты и сигналы без контекста. Становятся информацией после интерпретации.' },
        { term: 'Релевантность', definition: 'Соответствие информации текущей задаче.' },
        { term: 'Достоверность', definition: 'Свойство отражать реальное положение дел без искажений.' },
        { term: 'Полнота', definition: 'Достаточность информации для решения.' },
        { term: 'Актуальность', definition: 'Соответствие моменту времени.' },
        { term: 'Ценность', definition: 'Способность приносить пользу при решении задачи.' },
        { term: 'Понятность', definition: 'Свойство быть воспринятой адресатом.' },
      ],
      sections: [
        { type:'text', title:'Данные ≠ информация', body:`Число «25» — это данные. «25 градусов Цельсия за окном» — уже информация: появился контекст.

Классический пример из IT: логи сервера — это данные. Пока мы не проанализировали их и не увидели «в 14:32 была DDoS-атака», это просто поток символов.` },
        { type:'tips', title:'Практические советы', items:[
          'Прежде чем искать информацию — сформулируй задачу.',
          'Проверяй актуальность: смотри дату публикации и обновления.',
          'Достоверность проверяется минимум двумя независимыми источниками.'
        ]},
        { type:'mistakes', title:'Частые ошибки', items:[
          'Путать данные и информацию.',
          'Считать любую опубликованную информацию достоверной.',
          'Игнорировать актуальность.'
        ]},
        { type:'it', title:'Пример из IT', body:`В мониторинге серверов метрика CPU = 95% — это данные. «Сервер перегружен, нужно масштабирование» — информация.` }
      ]
    },
    {
      id: 'm2',
      title: '2. Источники информации',
      intro: 'Источники делятся на три уровня: первичные (оригиналы), вторичные (интерпретации) и третичные (навигация).',
      cards: [
        { term: 'Первичный источник', definition: 'Оригинал: научная статья, документация, патент, отчёт.' },
        { term: 'Вторичный источник', definition: 'Обзор, учебник, энциклопедическая статья, блог.' },
        { term: 'Третичный источник', definition: 'Справочники, каталоги, базы данных.' },
        { term: 'Peer-review', definition: 'Проверка работы независимыми экспертами до публикации.' },
        { term: 'Препринт', definition: 'Статья до рецензирования (arXiv, bioRxiv).' },
        { term: 'Grey literature', definition: 'Отчёты, техдокументация, диссертации без рецензирования.' },
        { term: 'Open Access', definition: 'Публикации в открытом доступе.' },
      ],
      sections: [
        { type:'text', title:'Пирамида источников', body:`Чем выше уровень источника, тем больше обработки он прошёл. Первичный — оригинал. Вторичный — интерпретация. Третичный — навигация.

Правило: если можно добраться до первичного источника — добирайся.` },
        { type:'tips', title:'Практические советы', items:[
          'Ищите оригинал: если статья ссылается на исследование — откройте его.',
          'Первичный источник в IT — документация, RFC, спецификации W3C.',
          'Препринт arXiv — быстро, но без рецензии.'
        ]},
        { type:'mistakes', title:'Частые ошибки', items:[
          'Использовать вторичный источник вместо первичного.',
          'Считать блог первичным источником.',
          'Приравнивать препринт к рецензируемой публикации.'
        ]},
        { type:'it', title:'Пример из IT', body:`Хотите узнать, как работает API? Откройте официальную документацию, а не блог — блог может быть устаревшим.` }
      ]
    },
    {
      id: 'm3',
      title: '3. Поисковые стратегии и операторы',
      intro: '90% времени поиска теряется из-за неправильно построенных запросов. Знание операторов и стратегий сокращает время в разы.',
      cards: [
        { term: 'AND / И', definition: 'Оба слова обязательны (в Google — пробел).' },
        { term: 'OR / ИЛИ', definition: 'Любое из слов: "python OR go".' },
        { term: 'NOT / минус', definition: 'Исключение слова: "java -script".' },
        { term: 'site:', definition: 'Поиск внутри домена.' },
        { term: 'filetype:', definition: 'Поиск файлов типа.' },
        { term: 'Кавычки "..."', definition: 'Точная фраза.' },
        { term: 'intitle:', definition: 'Слово в заголовке.' },
        { term: 'inurl:', definition: 'Слово в URL.' },
      ],
      sections: [
        { type:'text', title:'Стратегия: от общего к частному', body:`Начните с широкого запроса, чтобы понять ландшафт. Затем сужайте: site:, filetype:, ключевые слова. Не нашли на русском — попробуйте английский.` },
        { type:'tips', title:'Советы', items:[
          'Составьте список ключевых слов до поиска.',
          'Используйте несколько поисковиков.',
          'Для IT — специализированные базы: Stack Overflow, GitHub, документация.'
        ]},
        { type:'mistakes', title:'Ошибки', items:[
          'Слишком общий запрос.',
          'Игнорирование операторов.',
          'Поиск только на русском.'
        ]},
        { type:'it', title:'Пример из IT', body:`Плохой запрос: "ошибка react" → 10 млн результатов.
Хороший: "TypeError cannot read property of undefined" site:stackoverflow.com react → 200 результатов, все по делу.` }
      ]
    },
    {
      id: 'm4',
      title: '4. Критическая оценка источников',
      intro: 'Найти информацию — половина дела. Вторая — понять, можно ли ей доверять. CRAAP-тест — пять вопросов к каждому источнику.',
      cards: [
        { term: 'C — Currency', definition: 'Актуальность.' },
        { term: 'R — Relevance', definition: 'Соответствие задаче.' },
        { term: 'A — Authority', definition: 'Авторитет автора.' },
        { term: 'A — Accuracy', definition: 'Точность фактов.' },
        { term: 'P — Purpose', definition: 'Цель публикации.' },
        { term: 'SIFT-метод', definition: 'Stop, Investigate, Find, Trace.' },
        { term: 'Lateral reading', definition: 'Проверка сайта через другие источники.' },
      ],
      sections: [
        { type:'text', title:'CRAAP-тест', body:`**Currency.** Когда опубликовано? Есть ли дата обновления?

**Relevance.** Это про мою задачу?

const Storage = {
  KEY:'infalab_v7_state',
  USER_KEY:'infalab_v7_user',
  defaultState(){
    return {
      xp:0,
      theory:{},
      practice:{},
      badges:[],
      stats:{ correct:0, wrong:0, totalAttempts:0, scores:[] },
      history:[],
      createdAt: Date.now(),
    };
  },
  load(){
    try { const r = localStorage.getItem(this.KEY); return r ? JSON.parse(r) : this.defaultState(); }
    catch { return this.defaultState(); }
  },
  save(s){ localStorage.setItem(this.KEY, JSON.stringify(s)); },
  reset(){ localStorage.removeItem(this.KEY); },
  getUser(){ try { return JSON.parse(localStorage.getItem(this.USER_KEY) || 'null'); } catch { return null; } },
  setUser(u){ localStorage.setItem(this.USER_KEY, JSON.stringify(u)); }
};

const Progress = {
  LEVELS:[
    { name:'Новичок', xp:0 },
    { name:'Аналитик', xp:200 },
    { name:'Исследователь', xp:500 },
    { name:'Инфо-инженер', xp:1000 },
    { name:'Мастер информации', xp:2000 },
  ],
  addXP(amount, reason=''){
    if (amount <= 0) return;
    const s = Storage.load();
    s.xp += amount;
    Storage.save(s);
    this.updateBadge();
    this.toast(`+${amount} XP${reason?' — '+reason:''}`);
    this.checkLevelBadges();
  },
  levelInfo(xp){
    let idx = 0;
    this.LEVELS.forEach((l,i)=>{ if (xp >= l.xp) idx = i; });
    const current = this.LEVELS[idx];
    const next = this.LEVELS[idx+1] || null;
    const progress = next ? Math.round(((xp-current.xp)/(next.xp-current.xp))*100) : 100;
    return { current, next, progress, index: idx };
  },
  updateBadge(){
    const s = Storage.load();
    const el = document.getElementById('xp-value');
    if (el) el.textContent = s.xp;
  },
  toast(text){
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = text;
    document.body.appendChild(t);
    setTimeout(()=>t.remove(), 2400);
  },
  checkLevelBadges(){
    const s = Storage.load();
    if (s.xp >= 200 && !s.badges.includes('level_up')){
      s.badges.push('level_up'); Storage.save(s);
      this.toast('🏅 Бейдж: Аналитик (200 XP)');
    }
  }
};

const Stats = {
  record(correctCount, wrongCount, score){
    const s = Storage.load();
    s.stats.correct += correctCount;
    s.stats.wrong += wrongCount;
    s.stats.totalAttempts += 1;
    if (typeof score === 'number') s.stats.scores.push(score);
    Storage.save(s);
    if (score === 100 && !s.badges.includes('perfect')){
      s.badges.push('perfect'); Storage.save(s);
      Progress.toast('🏅 Бейдж: Перфекционист');
    }
  },
  summary(){
    const s = Storage.load();
    const st = s.stats;
    const total = st.correct + st.wrong;
    const avg = st.scores.length ? Math.round(st.scores.reduce((a,b)=>a+b,0)/st.scores.length) : 0;
    return {
      correct: st.correct, wrong: st.wrong, total,
      accuracy: total ? Math.round((st.correct/total)*100) : 0,
      attempts: st.totalAttempts, avgScore: avg,
    };
  },
  reset(){
    const s = Storage.load();
    s.stats = { correct:0, wrong:0, totalAttempts:0, scores:[] };
    Storage.save(s);
  }
};

const History = {
  add(moduleId, moduleName, score, correct, wrong){
    const s = Storage.load();
    s.history.push({
      date: Date.now(),
      moduleId, moduleName, score, correct, wrong,
    });
    if (s.history.length > 300) s.history = s.history.slice(-300);
    Storage.save(s);
    const today = new Date().setHours(0,0,0,0);
    const todayAttempts = s.history.filter(h => h.date >= today).length;
    if (todayAttempts >= 10 && !s.badges.includes('marathon')){
      s.badges.push('marathon'); Storage.save(s);
      Progress.toast('🏅 Бейдж: Марафонец');
    }
  },
  list(){ return Storage.load().history.slice().reverse(); },
  clear(){ const s = Storage.load(); s.history = []; Storage.save(s); }
};

const PracticeEngine = {
  start(stageEl, config){
    this.config = config;
    this.stage = stageEl;
    const s = Storage.load();
    const mod = s.practice[config.id] || { doneIds:[], attempts:0, bestScore:0 };
    const remaining = config.pool.filter(t => !mod.doneIds.includes(t.id));

    if (remaining.length === 0){
      this.renderAllDone();
      return;
    }
    this.currentTask = remaining[Math.floor(Math.random() * remaining.length)];
    this.renderTask();
  },

  renderTask(){
    const cfg = this.config;
    const s = Storage.load();
    const mod = s.practice[cfg.id] || { doneIds:[], attempts:0, bestScore:0 };
    const total = cfg.pool.length;
    const done = mod.doneIds.length;

    this.stage.innerHTML = `
      <div class="practice-stage">
        <div class="module-head">
          <h3>${cfg.icon} ${cfg.name}</h3>
          <span class="badge-xp">пройдено: ${done} / ${total}</span>
        </div>
        <div class="task-progress">
          <span>Задание <b>${done + 1}</b> из <b>${total}</b></span>
          <span>Лучший результат модуля: <b>${mod.bestScore || 0}%</b></span>
        </div>
        <div id="task-body"></div>
      </div>
    `;
    const body = document.getElementById('task-body');
    body.innerHTML = cfg.renderTask(this.currentTask);
    this.ctx = { answered: false, task: this.currentTask, container: body };
    cfg.bindTask(body, this.currentTask, this.ctx);

    const btnRow = document.createElement('div');
    btnRow.className = 'btn-row';
    btnRow.innerHTML = `
      <button class="btn" id="task-check">Проверить</button>
      <button class="btn btn-ghost" id="task-skip">Пропустить</button>
    `;
    body.appendChild(btnRow);
    document.getElementById('task-check').addEventListener('click', ()=>this.check());
    document.getElementById('task-skip').addEventListener('click', ()=>{
      if (this.ctx.answered) return;
      this.ctx.answered = true;
      this.renderNextButton(0, 0, 'Пропущено');
    });
  },

  check(){
    if (this.ctx.answered) return;
    this.ctx.answered = true;
    const res = this.config.checkTask(this.currentTask, this.ctx);
    const score = res.score;
    const correct = res.correct || 0;
    const wrong = res.wrong || 0;

    this.lockTask(score);
    this.recordResult(score, correct, wrong);

    const cls = score>=80?'good':score>=50?'mid':'bad';
    const details = res.details ? `<ul>${res.details.map(d=>`<li>${d}</li>`).join('')}</ul>` : '';
    const resultHtml = `
      <div class="result">
        <div class="score-big ${cls}">${score}%</div>
        <p>Правильно: ${correct} · Неправильно: ${wrong}</p>
        ${details}
      </div>
    `;
    document.getElementById('task-body').insertAdjacentHTML('beforeend', resultHtml);
    this.renderNextButton(score, correct, wrong);
  },

  lockTask(score){
    const s = Storage.load();
    const mod = s.practice[this.config.id] || { doneIds:[], attempts:0, bestScore:0 };
    if (!mod.doneIds.includes(this.currentTask.id)){
      mod.doneIds.push(this.currentTask.id);
    }
    mod.attempts += 1;
    mod.bestScore = Math.max(mod.bestScore, score);
    s.practice[this.config.id] = mod;
    Storage.save(s);
  },

  recordResult(score, correct, wrong){
    Stats.record(correct, wrong, score);
    History.add(this.config.id, this.config.name, score, correct, wrong);
    Progress.addXP(Math.max(2, Math.round(score/10)), this.config.name);
    this.checkPracticeBadges();
  },

  renderNextButton(score, correct, wrong){
    const cfg = this.config;
    const s = Storage.load();
    const mod = s.practice[cfg.id] || { doneIds:[] };
    const remaining = cfg.pool.filter(t => !mod.doneIds.includes(t.id));

    const btnRow = document.createElement('div');
    btnRow.className = 'btn-row';
    if (remaining.length === 0){
      btnRow.innerHTML = `<p class="hint">✅ Все задания модуля пройдены! Итоговый лучший результат: <b>${mod.bestScore}%</b></p>`;
    } else {
      btnRow.innerHTML = `<button class="btn btn-success" id="task-next">Следующее задание →</button>`;
      btnRow.querySelector('#task-next').addEventListener('click', ()=>{
        this.currentTask = remaining[Math.floor(Math.random() * remaining.length)];
        this.renderTask();
      });
    }
    this.ctx.container.querySelectorAll('#task-check, #task-skip').forEach(b=>b.remove());
    this.ctx.container.appendChild(btnRow);
  },

  renderAllDone(){
    const cfg = this.config;
    const s = Storage.load();
    const mod = s.practice[cfg.id] || { bestScore:0, attempts:0 };
    this.stage.innerHTML = `
      <div class="practice-stage">
        <div class="module-head">
          <h3>${cfg.icon} ${cfg.name}</h3>
          <span class="badge-done">✓ все задания пройдены</span>
        </div>
        <div class="result">
          <div class="score-big good">${mod.bestScore}%</div>
          <p>Лучший результат модуля</p>
          <p class="muted">Попыток: ${mod.attempts}</p>
        </div>
        <div class="btn-row">
          <button class="btn btn-ghost" id="restart-module">Пройти модуль заново</button>
        </div>
      </div>
    `;
    document.getElementById('restart-module').addEventListener('click', ()=>{
      const s = Storage.load();
      s.practice[cfg.id] = { doneIds:[], attempts: s.practice[cfg.id]?.attempts || 0, bestScore: s.practice[cfg.id]?.bestScore || 0 };
      Storage.save(s);
      this.start(this.stage, cfg);
    });
  },

  checkPracticeBadges(){
    const s = Storage.load();
    const ids = getAllPracticeIds();
    const done = ids.filter(k=>s.practice[k]?.doneIds?.length > 0).length;
    const newBadges = [];
    if (done >= 1 && !s.badges.includes('first_practice')) newBadges.push('first_practice');
    if (done >= ids.length && !s.badges.includes('all_practice')) newBadges.push('all_practice');
    if (newBadges.length){
      s.badges.push(...newBadges); Storage.save(s);
      newBadges.forEach(b=>{
        const bd = BADGES.find(x=>x.id===b);
        Progress.toast(`🏅 Бейдж: ${bd.name}`);
      });
    }
  }
};

  renderTask(t){

      <p class="task-text">Прочитай текст и отметь предложения, в которых есть <b>фактическая ошибка</b>.</p>
      <div class="text-block" id="text-block">
        ${t.sentences.map((s,i)=>`<span class="click-sentence" data-i="${i}">${s.text}</span>`).join(' ')}
      </div>
    `;
  },
  bindTask(container, task, ctx){
    ctx.selected = new Set();
    container.querySelectorAll('.click-sentence').forEach(el=>{
      el.addEventListener('click', ()=>{
        if (ctx.answered) return;
        const i = +el.dataset.i;
        if (ctx.selected.has(i)){ ctx.selected.delete(i); el.classList.remove('selected'); }
        else { ctx.selected.add(i); el.classList.add('selected'); }
      });
    });
  },
  checkTask(t, ctx){
    let correct = 0, wrong = 0;
    const details = [];
    ctx.container.querySelectorAll('.click-sentence').forEach(el=>{
      const i = +el.dataset.i;
      el.classList.remove('selected');
      const s = t.sentences[i];
      if (ctx.selected.has(i)){
        if (s.error){ el.classList.add('correct'); correct++; }
        else { el.classList.add('wrong'); wrong++; }
      } else if (s.error){ el.classList.add('wrong'); wrong++; details.push(`<b>Пропущено:</b> ${s.fix}`); }
      else correct++;
    });
    const score = Math.round((correct/t.sentences.length)*100);
    return { score, correct, wrong, details };
  }
};

        const i = +el.dataset.i;
        if (ctx.selected.has(i)){ ctx.selected.delete(i); el.classList.remove('selected'); }
        else { ctx.selected.add(i); el.classList.add('selected'); }
      });
    });

    let correct = 0, wrong = 0;
    ctx.container.querySelectorAll('.click-sentence').forEach(el=>{
      const i = +el.dataset.i;
      el.classList.remove('selected');
      const s = t.sentences[i];
      if (ctx.selected.has(i)){
        if (s.flag){ el.classList.add('correct'); correct++; }
        else { el.classList.add('wrong'); wrong++; }
      } else if (s.flag){ el.classList.add('wrong'); wrong++; }
      else correct++;
    });
    const score = Math.round((correct/t.sentences.length)*100);
    return { score, correct, wrong };
  }
};

          <div>

          </div>
        `).join('')}
      </div>
    `;
  },
  bindTask(){},
  checkTask(t, ctx){
    const inputs = ctx.container.querySelectorAll('[data-fi]');
    let correct = 0, wrong = 0;
    const norm = s => s.trim().toLowerCase().replace(/[.,;:]+$/,'').trim();
    inputs.forEach(inp=>{
      const expected = norm(inp.dataset.correct);
      const actual = norm(inp.value);
      if (actual === expected){ inp.style.borderColor = 'var(--success)'; correct++; }
      else { inp.style.borderColor = 'var(--danger)'; wrong++; }
      inp.disabled = true;
    });
    const score = Math.round((correct/inputs.length)*100);
    return { score, correct, wrong,
      details:[`<b>Правильная ссылка:</b> <code>${t.source}</code>`] };
  }
};

const ExamModule = {
  id:'exam', name:'Режим «Экзамен»', icon:'🎓',
  render(stage){
    this.stage = stage;
    this.questions = shuffle(EXAM_QUESTIONS).slice(0,20);
    this.current = 0;
    this.answers = {};
    this.done = false;
    this.renderQuestion();
  },
  renderQuestion(){
    const q = this.questions[this.current];
    const total = this.questions.length;
    const progress = this.questions.map((_,i)=>{
      const cls = i === this.current ? 'current' : (this.answers[i] != null ? 'done' : '');
      return `<div class="exam-dot ${cls}">${i+1}</div>`;
    }).join('');
    this.stage.innerHTML = `
      <div class="practice-stage">
        <div class="module-head"><h3>🎓 Экзамен · 20 вопросов</h3></div>
        <div class="task-progress"><span>Вопрос <b>${this.current+1}</b> из <b>${total}</b></span></div>
        <div style="display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap">${progress}</div>
        <div class="info-card"><p style="font-size:16px;font-weight:600">${q.q}</p></div>
        <div class="radio-list" id="exam-opts">
          ${q.options.map((o,i)=>`<label><input type="radio" name="eq" value="${i}" ${this.answers[this.current] === i ? 'checked' : ''}> <span>${o}</span></label>`).join('')}
        </div>
        <div class="btn-row">
          <button class="btn btn-ghost" id="exam-prev" ${this.current===0?'disabled':''}>← Назад</button>
          ${this.current < total - 1
            ? '<button class="btn" id="exam-next">Далее →</button>'
            : '<button class="btn btn-success" id="exam-finish">Завершить</button>'}
        </div>
      </div>
    `;
    this.stage.querySelectorAll('input[name="eq"]').forEach(inp=>{
      inp.addEventListener('change', ()=>{ this.answers[this.current] = +inp.value; });
    });
    document.getElementById('exam-prev')?.addEventListener('click', ()=>{ this.current--; this.renderQuestion(); });
    document.getElementById('exam-next')?.addEventListener('click', ()=>{ this.current++; this.renderQuestion(); });
    document.getElementById('exam-finish')?.addEventListener('click', ()=>this.finish());
  },
  finish(){
    if (this.done) return; this.done = true;
    let correct = 0;
    this.questions.forEach((q,i)=>{ if (this.answers[i] === q.correct) correct++; });
    const wrong = this.questions.length - correct;
    const score = Math.round((correct/this.questions.length)*100);
    const pass = score >= 70;
    const cls = score>=80?'good':score>=50?'mid':'bad';
    this.stage.innerHTML = `
      <div class="practice-stage">
        <div class="module-head"><h3>🎓 Итог экзамена</h3></div>
        <div class="result">
          <div class="score-big ${cls}">${score}%</div>
          <p>Правильно: <b>${correct}</b> из ${this.questions.length}</p>
          <p>${pass ? '✅ Экзамен сдан (проходной 70%)' : '❌ Не сдано (нужно 70%+)'}</p>
        </div>
        <div class="btn-row">
          <button class="btn" id="exam-retry">Пройти заново</button>
        </div>
      </div>
    `;
    document.getElementById('exam-retry').addEventListener('click', ()=>this.render(this.stage));
    Stats.record(correct, wrong, score);
    History.add('exam','Экзамен',score,correct,wrong);
    Progress.addXP(Math.max(5, Math.round(score/5)), 'Экзамен');
    if (pass && !Storage.load().badges.includes('exam_pass')){
      const s = Storage.load(); s.badges.push('exam_pass'); Storage.save(s);
      Progress.toast('🏅 Бейдж: Экзаменатор');
    }
  }
};

const TimeAttackModule = {
  id:'timeAttack', name:'Тайм-атака', icon:'⚡',
  render(stage){
    this.stage = stage;
    this.questions = shuffle(EXAM_QUESTIONS).slice(0,10);
    this.current = 0;
    this.score = 0;
    this.done = false;
    this.renderQuestion();
  },
  renderQuestion(){
    if (this.current >= this.questions.length){ this.finish(); return; }
    const q = this.questions[this.current];
    this.stage.innerHTML = `
      <div class="practice-stage">
        <div class="module-head"><h3>⚡ Тайм-атака · ${this.questions.length} вопросов</h3></div>
        <div class="task-progress">
          <span>Вопрос <b>${this.current+1}</b> из <b>${this.questions.length}</b></span>
          <span>Очки: <b>${this.score}</b></span>
        </div>
        <div class="info-card"><p style="font-size:16px;font-weight:600">${q.q}</p></div>
        <div class="options-list" id="ta-opts">
          ${q.options.map((o,i)=>`<button data-oi="${i}">${o}</button>`).join('')}
        </div>
      </div>
    `;
    this.stage.querySelectorAll('#ta-opts button').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        if (btn.disabled) return;
        const oi = +btn.dataset.oi;
        const ok = oi === q.correct;
        this.stage.querySelectorAll('#ta-opts button').forEach(b=>{
          b.disabled = true;
          const bi = +b.dataset.oi;
          if (bi === q.correct) b.classList.add('correct');
          if (bi === oi && !ok) b.classList.add('wrong');
        });
        if (ok) this.score++;
        setTimeout(()=>{ this.current++; this.renderQuestion(); }, 700);
      });
    });
  },
  finish(){
    if (this.done) return; this.done = true;
    const total = this.questions.length;
    const correct = this.score;
    const wrong = total - correct;
    const score = Math.round((correct/total)*100);
    const cls = score>=80?'good':score>=50?'mid':'bad';
    this.stage.innerHTML = `
      <div class="practice-stage">
        <div class="module-head"><h3>⚡ Итог тайм-атаки</h3></div>
        <div class="result">
          <div class="score-big ${cls}">${correct} / ${total}</div>
          <p>Правильных ответов: <b>${correct}</b></p>
        </div>
        <div class="btn-row"><button class="btn" id="ta-retry">Ещё раз</button></div>
      </div>
    `;
    document.getElementById('ta-retry').addEventListener('click', ()=>this.render(this.stage));
    Stats.record(correct, wrong, score);
    History.add('timeAttack','Тайм-атака',score,correct,wrong);
    Progress.addXP(Math.max(3, correct), 'Тайм-атака');
  }
};

const TheoryView = {
  render(){
    const s = Storage.load();
    const modules = THEORY_DATA.modules.map(m => {
      const done = s.theory[m.id]?.read;
      const quizScore = s.theory[m.id]?.quizScore;
      return `
        <section class="module theory-module" data-id="${m.id}">
          <div class="module-head">
            <h2>${m.title}</h2>
            <div>
              ${done ? '<span class="badge-done">✓ изучено</span>' : ''}
              ${quizScore != null ? `<span class="badge-xp">квиз: ${quizScore}%</span>` : ''}
            </div>
          </div>
          ${m.intro ? `<p class="theory-intro">${m.intro}</p>` : ''}
          <h3 class="theory-subtitle">📇 Ключевые понятия</h3>
          <div class="cards">
            ${m.cards.map(c=>`
              <div class="flip-card">
                <div class="flip-inner">
                  <div class="flip-front">${c.term}</div>
                  <div class="flip-back">${c.definition}</div>
                </div>

      `;
    }).join('');
    return `
      <h1>Теория</h1>
      <p class="muted" style="margin-bottom:14px">6 модулей · развёрнутые пояснения, советы и примеры из IT.</p>
      <div id="theory-container">${modules}</div>
    `;
  },
  renderSection(sec){
    if (sec.type === 'text') return `<div class="theory-section"><h3 class="theory-subtitle">${sec.title}</h3><div class="theory-body">${this.formatBody(sec.body)}</div></div>`;
    if (sec.type === 'tips') return `<div class="theory-section tips"><h3 class="theory-subtitle">💡 ${sec.title}</h3><ul class="theory-list">${sec.items.map(i=>`<li>${i}</li>`).join('')}</ul></div>`;
    if (sec.type === 'mistakes') return `<div class="theory-section mistakes"><h3 class="theory-subtitle">⚠️ ${sec.title}</h3><ul class="theory-list">${sec.items.map(i=>`<li>${i}</li>`).join('')}</ul></div>`;
    if (sec.type === 'it') return `<div class="theory-section it"><h3 class="theory-subtitle">💻 ${sec.title}</h3><div class="theory-body">${this.formatBody(sec.body)}</div></div>`;
    return '';
  },
  formatBody(text){
    return text.split('\n\n').map(par => `<p>${par.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\n/g,'<br>')}</p>`).join('');
  },
  bind(){
    document.querySelectorAll('.flip-card').forEach(c=>{
      c.addEventListener('click', ()=>c.classList.toggle('flipped'));
    });
    document.querySelectorAll('[data-quiz]').forEach(btn=>{
      btn.addEventListener('click', ()=>this.openQuiz(btn.dataset.quiz));
    });
    document.querySelectorAll('.theory-module').forEach(mod=>{
      const id = mod.dataset.id;
      let marked = false;
      const markRead = ()=>{
        if (marked) return;
        marked = true;
        const s = Storage.load();
        s.theory[id] = { ...(s.theory[id]||{}), read: true };
        Storage.save(s);
        if (!mod.querySelector('.badge-done')){
          const span = document.createElement('span');
          span.className = 'badge-done';
          span.textContent = '✓ изучено';
          mod.querySelector('.module-head > div').prepend(span);
        }
        this.checkTheoryBadges();
      };
      const timer = setTimeout(markRead, 40000);
      mod.addEventListener('mouseleave', ()=>clearTimeout(timer), { once:true });
      mod.querySelector('[data-quiz]')?.addEventListener('click', ()=>clearTimeout(timer));
    });
  },
  checkTheoryBadges(){
    const s = Storage.load();
    const done = Object.values(s.theory).filter(x=>x.read).length;
    const newBadges = [];
    if (done >= 1 && !s.badges.includes('first_theory')) newBadges.push('first_theory');
    if (done >= 3 && !s.badges.includes('half_theory'))  newBadges.push('half_theory');
    if (done >= 6 && !s.badges.includes('all_theory'))   newBadges.push('all_theory');
    if (newBadges.length){
      s.badges.push(...newBadges);
      Storage.save(s);
      newBadges.forEach(b=>{
        const bd = BADGES.find(x=>x.id===b);
        Progress.toast(`🏅 Бейдж: ${bd.name}`);
      });
    }
  },
  openQuiz(id){
    const zone = document.querySelector(`[data-zone="${id}"]`);
    const quiz = QUIZZES[id] || [];
    if (!quiz.length || zone.dataset.open === '1') return;
    zone.dataset.open = '1';
    zone.innerHTML = `
      <div class="quiz-block">
        <h3>Мини-квиз · ${quiz.length} вопросов</h3>
        ${quiz.map((q,qi)=>`
          <div class="quiz-q">
            <p><b>${qi+1}. ${q.q}</b></p>
            ${q.options.map((o,oi)=>`<label><input type="radio" name="q${id}_${qi}" value="${oi}"> ${o}</label>`).join('')}
          </div>
        `).join('')}
        <button class="btn" id="quiz-submit-${id}">Проверить</button>
        <div id="quiz-result-${id}"></div>
      </div>
    `;
    document.getElementById(`quiz-submit-${id}`).addEventListener('click', ()=>{
      if (zone.dataset.done === '1') return;
      zone.dataset.done = '1';
      let correct = 0;
      quiz.forEach((q,qi)=>{
        const sel = document.querySelector(`input[name="q${id}_${qi}"]:checked`);
        if (sel && +sel.value === q.correct) correct++;
      });
      const wrong = quiz.length - correct;
      const score = Math.round((correct/quiz.length)*100);
      const cls = score>=80?'good':score>=50?'mid':'bad';
      document.getElementById(`quiz-result-${id}`).innerHTML = `
        <div class="result">
          <div class="score-big ${cls}">${score}%</div>
          <p>Правильно: ${correct} из ${quiz.length}</p>
        </div>
      `;
      document.querySelector(`#quiz-submit-${id}`).disabled = true;
      const s = Storage.load();
      s.theory[id] = { ...(s.theory[id]||{}), read: true, quizScore: Math.max(s.theory[id]?.quizScore||0, score) };
      Storage.save(s);
      this.checkTheoryBadges();
      Stats.record(correct, wrong, score);
      History.add(id, 'Теория: ' + id, score, correct, wrong);
      Progress.addXP(Math.round(score/10), 'Квиз по теории');
    });
  }
};

      <p class="muted" style="margin-bottom:20px">${PRACTICE_MODULES.length + 2} интерактивных модулей. Задания аналитические: анализ, обработка, конвертация информации.</p>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px">
        ${PRACTICE_MODULES.map(m=>{
          const mod = s.practice[m.id] || { doneIds:[], bestScore:0 };
          const total = m.pool.length;
          const done = mod.doneIds.length;
          const pct = Math.round((done/total)*100);
          return `
            <div class="module" style="margin:0">
              <div style="font-size:32px;margin-bottom:6px">${m.icon}</div>
              <h3>${m.name}</h3>
              <p class="muted" style="font-size:13px">Заданий: ${total}</p>
              <div class="progress-bar"><div style="width:${pct}%"></div></div>
              <p class="muted" style="font-size:12px">Пройдено: ${done} / ${total}${mod.bestScore ? ' · лучший: '+mod.bestScore+'%' : ''}</p>
              <button class="btn" data-launch="${m.id}" style="width:100%;margin-top:8px">Начать</button>
            </div>
          `;
        }).join('')}
        <div class="module" style="margin:0">
          <div style="font-size:32px;margin-bottom:6px">🎓</div>
          <h3>Режим «Экзамен»</h3>
          <p class="muted" style="font-size:13px">20 вопросов · проходной 70%</p>
          <button class="btn" data-launch="exam" style="width:100%;margin-top:8px">Начать</button>
        </div>
        <div class="module" style="margin:0">
          <div style="font-size:32px;margin-bottom:6px">⚡</div>
          <h3>Тайм-атака</h3>
          <p class="muted" style="font-size:13px">10 вопросов</p>
          <button class="btn" data-launch="timeAttack" style="width:100%;margin-top:8px">Начать</button>
        </div>
      </div>
      <div id="practice-stage"></div>
    `;
  },
  bind(){
    document.querySelectorAll('[data-launch]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const id = btn.dataset.launch;
        const stage = document.getElementById('practice-stage');
        stage.innerHTML = '';
        if (id === 'exam') ExamModule.render(stage);
        else if (id === 'timeAttack') TimeAttackModule.render(stage);
        else {
          const mod = PRACTICE_MODULES.find(m=>m.id===id);
          if (mod) PracticeEngine.start(stage, mod);
        }
        stage.scrollIntoView({ behavior:'smooth', block:'start' });
      });
    });
  }
};

const ProfileView = {
  render(){
    const s = Storage.load();
    const user = Storage.getUser();
    const lvl = Progress.levelInfo(s.xp);
    const practiceIds = getAllPracticeIds();
    const theoryDone = Object.values(s.theory).filter(x=>x.read).length;
    const practiceDone = practiceIds.filter(k => (s.practice[k]?.doneIds?.length || 0) > 0).length;
    const totalItems = THEORY_DATA.modules.length + practiceIds.length;
    const overall = Math.round(((theoryDone + practiceDone) / totalItems) * 100);
    const sum = Stats.summary();
    const history = History.list();
    return `
      <h1>Профиль</h1>
      <div class="module">
        <h2>👤 ${user?.name || 'Гость'}</h2>
        ${user?.group ? `<p class="muted">Группа: ${user.group}</p>` : ''}
        <button class="btn btn-ghost btn-sm" id="edit-user" style="margin-top:8px">Изменить данные</button>
      </div>
      <div class="module">
        <h2>${lvl.current.name}</h2>
        <p class="muted">${s.xp} XP ${lvl.next ? `· до «${lvl.next.name}» ещё ${lvl.next.xp - s.xp} XP` : '· максимальный уровень'}</p>
        <div class="progress-bar"><div style="width:${lvl.progress}%"></div></div>
      </div>
      <div class="module">
        <h2>Статистика</h2>
        <div class="stat-grid">
          <div class="stat-card"><div class="num good">${sum.correct}</div><div class="lbl">Правильных</div></div>
          <div class="stat-card"><div class="num bad">${sum.wrong}</div><div class="lbl">Неправильных</div></div>
          <div class="stat-card"><div class="num">${sum.accuracy}%</div><div class="lbl">Точность</div></div>
          <div class="stat-card"><div class="num">${sum.attempts}</div><div class="lbl">Попыток</div></div>
        </div>
      </div>
      <div class="module">
        <h2>Прогресс</h2>
        <p>📖 Теория: <b>${theoryDone} / ${THEORY_DATA.modules.length}</b></p>
        <p>🧪 Практика: <b>${practiceDone} / ${practiceIds.length}</b></p>
        <p>🎯 Общий: <b>${overall}%</b></p>
      </div>
      <div class="module">
        <h2>История (${history.length})</h2>
        ${history.length === 0
          ? '<p class="history-empty">Пока нет попыток.</p>'
          : `<table class="history-table">
              <thead><tr><th>Дата</th><th>Модуль</th><th>Результат</th><th>Ответы</th></tr></thead>
              <tbody>
                ${history.slice(0,30).map(h=>{
                  const cls = h.score>=80?'good':h.score>=50?'mid':'bad';
                  const d = new Date(h.date);
                  const dateStr = d.toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
                  return `<tr><td>${dateStr}</td><td>${h.moduleName}</td><td class="${cls}"><b>${h.score}%</b></td><td>${h.correct}✓ / ${h.wrong}✗</td></tr>`;
                }).join('')}
              </tbody>
            </table>
            <button class="btn btn-ghost btn-sm" id="clear-history" style="margin-top:14px">Очистить историю</button>`}
      </div>
      <div class="module">
        <h2>Бейджи</h2>
        <div class="badge-grid">
          ${BADGES.map(b=>{
            const earned = s.badges.includes(b.id);
            return `<div class="badge ${earned?'earned':''}"><div class="emoji">${b.emoji}</div><div class="name">${b.name}</div><div class="desc">${b.desc}</div></div>`;
          }).join('')}
        </div>
      </div>
      <div class="module no-print">
        <h2>Экспорт и отчётность</h2>
        <p class="muted" style="margin-bottom:14px">Скачай прогресс в JSON или сформируй PDF-отчёт для сдачи.</p>
        <button class="btn" id="report-btn">📄 Сформировать PDF-отчёт</button>
        <button class="btn btn-ghost" id="export-btn" style="margin-left:8px">💾 Скачать JSON</button>
        <label class="btn btn-ghost" style="display:inline-block;cursor:pointer;margin-left:8px">📂 Загрузить JSON<input type="file" id="import-input" accept=".json" style="display:none"></label>
        <button class="btn btn-danger" id="reset-btn" style="margin-left:8px">🗑 Сбросить</button>
      </div>
    `;
  },
  bind(){
    document.getElementById('report-btn')?.addEventListener('click', ()=>Report.generate());
    document.getElementById('export-btn')?.addEventListener('click', ()=>{
      const data = JSON.stringify({ user: Storage.getUser(), state: Storage.load() }, null, 2);
      const blob = new Blob([data], { type:'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `infalab-${Date.now()}.json`; a.click();
      URL.revokeObjectURL(url);
    });
    document.getElementById('import-input')?.addEventListener('change', e=>{
      const file = e.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = ev=>{
        try {
          const data = JSON.parse(ev.target.result);
          if (data.state){ Storage.save(data.state); if (data.user) Storage.setUser(data.user); }
          else Storage.save(data);
          Progress.updateBadge(); UserUI.refresh(); App.navigate('profile');
          Progress.toast('Прогресс загружен');
        } catch { alert('Некорректный файл'); }
      };
      reader.readAsText(file);
    });
    document.getElementById('reset-btn')?.addEventListener('click', ()=>{
      if (confirm('Сбросить весь прогресс?')){ Storage.reset(); Progress.updateBadge(); App.navigate('home'); }
    });
    document.getElementById('clear-history')?.addEventListener('click', ()=>{
      if (confirm('Очистить историю?')){ History.clear(); App.navigate('profile'); }
    });
    document.getElementById('edit-user')?.addEventListener('click', ()=>UserUI.openModal(true));
  }
};

/* ============================================================
   9. USER UI
   ============================================================ */

const UserUI = {
  refresh(){
    const u = Storage.getUser();
    const el = document.getElementById('user-name-btn');
    if (el) el.textContent = u ? '👤 ' + u.name : '👤 Гость';
  },
  openModal(force){
    const u = Storage.getUser() || { name:'', group:'' };
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal">
        <h2>${force ? 'Изменить данные' : 'Представься'}</h2>
        <p class="muted">Данные хранятся только в этом браузере.</p>
        <input type="text" id="user-fio" placeholder="ФИО" value="${u.name||''}">
        <input type="text" id="user-group" placeholder="Группа" value="${u.group||''}">
        <div class="actions">
          <button class="btn" id="user-save">Сохранить</button>
          ${force ? '<button class="btn btn-ghost" id="user-cancel">Отмена</button>' : ''}
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    document.getElementById('user-save').addEventListener('click', ()=>{
      const name = document.getElementById('user-fio').value.trim();
      const group = document.getElementById('user-group').value.trim();
      if (!name){ alert('Введи ФИО'); return; }
      Storage.setUser({ name, group });
      overlay.remove(); this.refresh(); Progress.toast('Данные сохранены');
    });
    document.getElementById('user-cancel')?.addEventListener('click', ()=>overlay.remove());
  },
  init(){
    this.refresh();
    if (!Storage.getUser()) this.openModal(false);
    document.getElementById('user-name-btn').addEventListener('click', ()=>this.openModal(true));
  }
};

/* ============================================================
   10. ОТЧЁТ (PDF через печать браузера)
   ============================================================ */

const Report = {
  generate(){
    const s = Storage.load();
    const user = Storage.getUser() || { name:'Не указано', group:'' };
    const lvl = Progress.levelInfo(s.xp);
    const sum = Stats.summary();
    const history = History.list();

    const practiceNames = {};
    PRACTICE_MODULES.forEach(m=>{ practiceNames[m.id] = m.name; });
    practiceNames.exam = 'Экзамен';
    practiceNames.timeAttack = 'Тайм-атака';

    const theoryRows = THEORY_DATA.modules.map(m=>{
      const t = s.theory[m.id] || {};
      return `<tr><td>${m.title}</td><td>${t.read?'✓':'—'}</td><td>${t.quizScore!=null?t.quizScore+'%':'—'}</td></tr>`;
    }).join('');

    const practiceRows = Object.keys(practiceNames).map(k=>{
      const p = s.practice[k] || {};
      const mod = PRACTICE_MODULES.find(m=>m.id===k);
      const total = mod ? mod.pool.length : '—';
      const done = (p.doneIds?.length || 0);
      return `<tr><td>${practiceNames[k]}</td><td>${done} / ${total}</td><td>${p.bestScore!=null?p.bestScore+'%':'—'}</td><td>${p.attempts||0}</td></tr>`;
    }).join('');

    const theoryDone = Object.values(s.theory).filter(x=>x.read).length;
    const practiceIds = getAllPracticeIds();
    const practiceDone = practiceIds.filter(k=>(s.practice[k]?.doneIds?.length || 0) > 0).length;
    const totalItems = THEORY_DATA.modules.length + practiceIds.length;
    const overall = Math.round(((theoryDone + practiceDone) / totalItems) * 100);

    const badgesList = BADGES.filter(b=>s.badges.includes(b.id))
      .map(b=>`<li>${b.emoji} <b>${b.name}</b> — ${b.desc}</li>`).join('') || '<li style="color:#777;font-style:italic">Пока нет бейджей</li>';

    const historyRows = history.slice(0,30).map(h=>{
      const d = new Date(h.date);
      const dateStr = d.toLocaleString('ru-RU');
      const cls = h.score>=80?'good':h.score>=50?'mid':'bad';
      return `<tr>
        <td>${dateStr}</td>
        <td>${h.moduleName}</td>
        <td class="${cls}"><b>${h.score}%</b></td>
        <td>${h.correct}✓ / ${h.wrong}✗</td>
      </tr>`;
    }).join('');

    const date = new Date().toLocaleString('ru-RU');

    const win = window.open('', '_blank');
    win.document.write(`
      <!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8">
      <title>Отчёт ИнфоЛаб — ${user.name}</title>
      <style>
        body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#111;max-width:850px;margin:30px auto;padding:0 20px;line-height:1.5}
        h1{border-bottom:2px solid #333;padding-bottom:8px;margin-bottom:16px}
        h2{margin-top:24px;border-bottom:1px solid #ddd;padding-bottom:4px}
        table{width:100%;border-collapse:collapse;margin:12px 0;font-size:12px}
        th,td{text-align:left;padding:5px 8px;border-bottom:1px solid #eee}
        th{background:#f5f5f5}
        .box{background:#f9f9f9;padding:14px;border-radius:8px;margin:14px 0;border:1px solid #eee}
        ul{padding-left:20px}
        .footer{margin-top:40px;font-size:12px;color:#777;border-top:1px solid #ddd;padding-top:10px}
        .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
        .stat{background:#f0f4ff;border:1px solid #d0dcff;border-radius:8px;padding:12px;text-align:center}
        .stat .n{font-size:22px;font-weight:700;color:#5b8cff}
        .stat .l{font-size:11px;color:#555;margin-top:2px}
        .signature{margin-top:40px;display:flex;justify-content:space-between;font-size:13px;color:#333}
        .signature div{flex:1}
        .line{border-bottom:1px solid #999;height:20px;margin-bottom:4px}
        .good{color:#16a34a}
        .mid{color:#d97706}
        .bad{color:#dc2626}
        @media print { body{margin:0} .no-print{display:none} .stats-grid,.signature{page-break-inside:avoid} h2{page-break-after:avoid} }
      </style></head><body>
      <h1>🧠 ИнфоЛаб — отчёт о работе</h1>
      <p><b>Дисциплина:</b> Основы работы с информацией</p>
      <p><b>Студент:</b> ${user.name}${user.group ? ' · группа ' + user.group : ''}</p>
      <p><b>Дата формирования:</b> ${date}</p>

      <h2>Общий результат</h2>
      <div class="box">
        <p><b>Уровень:</b> ${lvl.current.name} · <b>XP:</b> ${s.xp}</p>
        <p><b>Общий прогресс дисциплины:</b> ${overall}%</p>
        <p><b>Модулей теории:</b> ${theoryDone} / ${THEORY_DATA.modules.length}</p>
        <p><b>Практик начато:</b> ${practiceDone} / ${practiceIds.length}</p>
      </div>

      <h2>Счётчик ответов</h2>
      <div class="stats-grid">
        <div class="stat"><div class="n">${sum.correct}</div><div class="l">Правильных</div></div>
        <div class="stat"><div class="n">${sum.wrong}</div><div class="l">Неправильных</div></div>
        <div class="stat"><div class="n">${sum.accuracy}%</div><div class="l">Точность</div></div>
        <div class="stat"><div class="n">${sum.avgScore}%</div><div class="l">Средний балл</div></div>
      </div>
      <p style="font-size:13px;color:#555">Всего попыток: ${sum.attempts} · Всего ответов: ${sum.total}</p>

      <h2>Теория</h2>
      <table><thead><tr><th>Модуль</th><th>Изучен</th><th>Квиз</th></tr></thead><tbody>${theoryRows}</tbody></table>

      <h2>Практика</h2>
      <table><thead><tr><th>Модуль</th><th>Пройдено заданий</th><th>Лучший результат</th><th>Попыток</th></tr></thead><tbody>${practiceRows}</tbody></table>

      <h2>Достижения</h2>
      <ul>${badgesList}</ul>

      <h2>История попыток (последние 30 из ${history.length})</h2>
      ${history.length === 0
        ? '<p style="color:#777;font-style:italic">Нет попыток</p>'
        : `<table>
            <thead><tr><th>Дата</th><th>Модуль</th><th>Результат</th><th>Ответы</th></tr></thead>
            <tbody>${historyRows}</tbody>
          </table>`}

      <div class="signature">
        <div><div class="line"></div><div>Подпись студента</div></div>
        <div style="margin-left:40px"><div class="line"></div><div>Подпись преподавателя</div></div>
      </div>

      <div class="footer">
        Отчёт сформирован автоматически в веб-приложении «ИнфоЛаб».
        Для сохранения в PDF: нажми «Печать» (Ctrl+P) и выбери «Сохранить как PDF».
      </div>

      <button class="no-print" onclick="window.print()" style="margin-top:20px;padding:10px 20px;background:#5b8cff;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:15px">🖨 Печать / Сохранить в PDF</button>
      </body></html>
    `);
    win.document.close();
  }
};

/* ============================================================
   11. APP
   ============================================================ */

const App = {
  currentView: 'home',
  views: {
    home:     { render: ()=>HomeView.render(),     bind: ()=>{} },
    theory:   { render: ()=>TheoryView.render(),   bind: ()=>TheoryView.bind() },
    practice: { render: ()=>PracticeView.render(), bind: ()=>PracticeView.bind() },
    profile:  { render: ()=>ProfileView.render(),  bind: ()=>ProfileView.bind() },
  },
  navigate(view){
    this.currentView = view;
    document.querySelectorAll('.tabs button').forEach(b=>{
      b.classList.toggle('active', b.dataset.view === view);
    });
    const main = document.getElementById('app');
    main.innerHTML = this.views[view].render();
    this.views[view].bind();
    window.scrollTo({ top:0, behavior:'smooth' });
  },
  init(){
    document.querySelectorAll('.tabs button').forEach(btn=>{
      btn.addEventListener('click', ()=>this.navigate(btn.dataset.view));
    });
    Progress.updateBadge();
    UserUI.init();
    this.navigate('home');
  }
};

document.addEventListener('DOMContentLoaded', ()=>App.init());
</script>
</body>
</html>
