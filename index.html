<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ИнфоЛаб — Основы работы с информацией</title>
<style>
:root{
  --bg:#0f1115; --surface:#171a21; --surface-2:#1e222b; --surface-3:#252a36;
  --text:#e6e8ee; --muted:#9aa3b2;
  --accent:#5b8cff; --accent-soft:#2a3550;
  --success:#4ade80; --warn:#fbbf24; --danger:#f87171;
  --radius:12px;
  --font: system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);line-height:1.55;min-height:100vh}
.app-header{display:flex;align-items:center;gap:16px;padding:12px 22px;background:var(--surface);border-bottom:1px solid #232735;position:sticky;top:0;z-index:10;flex-wrap:wrap}
.logo{font-weight:700;font-size:18px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{background:transparent;border:none;color:var(--muted);padding:8px 12px;border-radius:8px;cursor:pointer;font-size:14px;transition:.2s;font-family:inherit}
.tabs button:hover{color:var(--text);background:var(--surface-2)}
.tabs button.active{color:var(--text);background:var(--accent-soft)}
.user-badge{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.user-name{background:var(--surface-2);padding:5px 12px;border-radius:999px;font-size:13px;cursor:pointer}
.user-name:hover{background:var(--accent-soft)}
.xp-badge{background:var(--accent-soft);padding:5px 12px;border-radius:999px;font-weight:600;font-size:13px}
main{padding:28px 22px;max-width:1100px;margin:0 auto}
h1,h2,h3{line-height:1.25;margin-bottom:12px}
h1{font-size:26px;margin-bottom:16px}
h2{font-size:20px}
h3{font-size:17px}
p{margin-bottom:10px}
.muted{color:var(--muted)}
.btn{background:var(--accent);border:none;color:#fff;padding:10px 18px;border-radius:8px;cursor:pointer;font-weight:600;font-family:inherit;font-size:15px;transition:.15s}
.btn:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-ghost{background:transparent;border:1px solid #2a3140;color:var(--text)}
.btn-ghost:hover{background:var(--surface-2);filter:none}
.btn-success{background:var(--success);color:#0a1a0f}
.btn-danger{background:var(--danger);color:#2a0a0a}
.btn-sm{padding:6px 12px;font-size:13px}

.module{background:var(--surface);border:1px solid #232735;border-radius:var(--radius);padding:22px;margin-bottom:20px}
.module-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.badge-done{background:rgba(74,222,128,.15);color:var(--success);padding:4px 10px;border-radius:999px;font-size:13px;white-space:nowrap}
.badge-xp{background:rgba(91,140,255,.15);color:var(--accent);padding:4px 10px;border-radius:999px;font-size:13px}

.timer{display:flex;align-items:center;gap:8px;background:var(--surface-2);padding:6px 12px;border-radius:999px;font-weight:700;font-size:15px;font-family:'Courier New',monospace;margin-bottom:14px;width:fit-content}
.timer.warn{color:var(--warn);background:rgba(251,191,36,.1)}
.timer.danger{color:var(--danger);background:rgba(248,113,113,.15);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.timer .icon{font-size:14px}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-bottom:16px}
.flip-card{perspective:1000px;height:160px;cursor:pointer}
.flip-inner{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flip-card.flipped .flip-inner{transform:rotateY(180deg)}
.flip-front,.flip-back{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;padding:14px;display:flex;align-items:center;justify-content:center;text-align:center;border:1px solid #232735;overflow:auto}
.flip-front{background:var(--surface-2);font-weight:600}
.flip-back{background:var(--accent-soft);transform:rotateY(180deg);font-size:14px}

.trainer, .detective, .citation, .craap, .textsearch, .imganalysis, .licenses, .plagiarism,
.factopinion, .chronology, .mindmap, .factcheck, .sourceType, .manipulation, .noise, .wikiEditor,
.reverseSearch, .abstract, .logicErrors, .correlation, .refManager, .rfcReader, .redFlags, .compareSources,
.examMode, .timeAttack {
  background:var(--surface);border:1px solid #232735;border-radius:var(--radius);padding:22px;margin-top:20px
}
.task-text{font-size:16px;margin:10px 0 16px}
input[type=text],select,textarea{width:100%;padding:12px 14px;background:var(--surface-2);border:1px solid #2a3140;border-radius:8px;color:var(--text);font-family:inherit;font-size:15px;margin-bottom:10px}
input[type=text]:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
textarea{min-height:80px;resize:vertical}
.hints{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;font-size:13px;color:var(--muted);align-items:center}
.hints code{background:var(--surface-2);padding:2px 8px;border-radius:6px;color:var(--accent);cursor:pointer}
.hints code:hover{background:var(--accent-soft)}
.result{margin-top:16px;padding:16px;background:var(--surface-2);border-radius:8px}
.score-big{font-size:32px;font-weight:700;color:var(--accent);margin-bottom:10px}
.score-big.good{color:var(--success)}
.score-big.mid{color:var(--warn)}
.score-big.bad{color:var(--danger)}
.result ul{list-style:none}
.result li{padding:3px 0;font-size:14px}
.hint{margin-top:10px;font-size:14px;color:var(--muted)}
.hint code{background:var(--bg);padding:2px 8px;border-radius:6px;color:var(--accent)}

.quiz-block{margin-top:14px;padding:16px;background:var(--surface-2);border-radius:8px}
.quiz-q{margin:14px 0}
.quiz-q label{display:block;padding:8px 10px;cursor:pointer;border-radius:6px;transition:.15s}
.quiz-q label:hover{background:var(--surface-3)}
.quiz-q input{margin-right:8px}

.sources{list-style:none;margin:14px 0}
.sources li{background:var(--surface-2);border:1px solid #2a3140;border-radius:8px;padding:12px 14px;margin-bottom:8px;cursor:grab;transition:.15s;display:flex;gap:12px;align-items:flex-start}
.sources li:hover{border-color:var(--accent)}
.sources li.dragging{opacity:.4}
.sources li .handle{color:var(--muted);font-size:18px;line-height:1}
.src-title{font-weight:600;font-size:15px;margin-bottom:4px}
.src-meta{font-size:13px;color:var(--muted)}

.cite-blocks{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin-bottom:14px}
.cite-blocks button{background:var(--surface-2);border:1px solid #2a3140;color:var(--text);padding:10px;border-radius:8px;cursor:pointer;font-size:13px;text-align:left;font-family:inherit}
.cite-blocks button:hover{border-color:var(--accent)}
.cite-preview{min-height:60px;background:var(--surface-2);border:1px dashed #2a3140;border-radius:8px;padding:12px;font-family:'Courier New',monospace;font-size:13px;margin-bottom:12px;line-height:1.6}

.craap-item{background:var(--surface-2);border-radius:8px;padding:14px;margin-bottom:10px}
.craap-item h4{margin-bottom:6px;font-size:15px}
.craap-item .q{font-size:14px;color:var(--muted);margin-bottom:8px}
.craap-options{display:flex;gap:8px;flex-wrap:wrap}
.craap-options label{background:var(--surface-3);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px}
.craap-options input{margin-right:6px}

.progress-bar{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden;margin:10px 0}
.progress-bar>div{height:100%;background:linear-gradient(90deg,var(--accent),#8b5bff);transition:width .5s}

.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:12px}
.badge{background:var(--surface-2);border:1px solid #232735;border-radius:10px;padding:14px;text-align:center;opacity:.35;transition:.3s}
.badge.earned{opacity:1;border-color:var(--accent);background:linear-gradient(180deg,var(--surface-2),var(--accent-soft))}
.badge .emoji{font-size:28px;margin-bottom:6px}
.badge .name{font-size:13px;font-weight:600}
.badge .desc{font-size:11px;color:var(--muted);margin-top:4px}

.toast{position:fixed;bottom:24px;right:24px;background:var(--accent);color:#fff;padding:12px 18px;border-radius:8px;animation:slideUp .3s;z-index:100;font-weight:600}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}

.ts-text{background:var(--surface-2);border-radius:8px;padding:16px;font-size:15px;line-height:1.7;margin-bottom:14px}
.ts-sentence{cursor:pointer;padding:2px 3px;border-radius:4px;transition:.15s}
.ts-sentence:hover{background:var(--surface-3)}
.ts-sentence.selected{background:rgba(91,140,255,.3);box-shadow:0 0 0 1px var(--accent)}
.ts-sentence.correct{background:rgba(74,222,128,.25);box-shadow:0 0 0 1px var(--success)}
.ts-sentence.wrong{background:rgba(248,113,113,.25);box-shadow:0 0 0 1px var(--danger)}

.img-card{background:var(--surface-2);border-radius:10px;padding:18px;margin-bottom:14px}
.img-visual{background:#fff;color:#111;border-radius:8px;padding:18px;margin:10px 0;font-family:'Courier New',monospace;font-size:13px;white-space:pre;overflow:auto;line-height:1.5}
.img-options{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.img-options label{background:var(--surface-3);padding:8px 12px;border-radius:6px;cursor:pointer;font-size:14px}
.img-options label:hover{background:#2f3444}

.lic-item{background:var(--surface-2);border-radius:10px;padding:16px;margin-bottom:12px}
.lic-desc{font-size:14px;color:var(--muted);margin:6px 0 10px}
.lic-options{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
.lic-options button{background:var(--surface-3);border:1px solid #2a3140;color:var(--text);padding:8px;border-radius:6px;cursor:pointer;font-size:13px;font-family:inherit;transition:.15s}
.lic-options button:hover{border-color:var(--accent)}
.lic-options button.chosen{border-color:var(--accent);background:var(--accent-soft)}
.lic-options button.correct{border-color:var(--success);background:rgba(74,222,128,.15)}
.lic-options button.wrong{border-color:var(--danger);background:rgba(248,113,113,.15)}

.plag-case{background:var(--surface-2);border-radius:10px;padding:16px;margin-bottom:14px}
.plag-source,.plag-student{background:var(--surface-3);border-radius:6px;padding:10px;margin:8px 0;font-size:14px}
.plag-source{border-left:3px solid var(--accent)}
.plag-student{border-left:3px solid var(--warn)}
.plag-options{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.plag-options label{background:var(--surface-3);padding:8px 12px;border-radius:6px;cursor:pointer;font-size:14px}
.plag-options label:hover{background:#2f3444}

.two-columns{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}
@media(max-width:600px){.two-columns{grid-template-columns:1fr}}
.column{background:var(--surface-2);border-radius:10px;padding:14px;min-height:200px}
.column h4{margin-bottom:10px;font-size:14px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.column.fact h4{color:var(--success)}
.column.opinion h4{color:var(--warn)}
.fo-items{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.fo-item{background:var(--surface-3);border:1px solid #2a3140;border-radius:8px;padding:10px 12px;cursor:grab;font-size:14px;transition:.15s}
.fo-item:hover{border-color:var(--accent)}
.fo-item.dragging{opacity:.4}
.fo-item.placed{cursor:default}

.chrono-list{list-style:none;margin:14px 0}
.chrono-list li{background:var(--surface-2);border:1px solid #2a3140;border-radius:8px;padding:12px 14px;margin-bottom:8px;cursor:grab;display:flex;gap:12px;align-items:center}
.chrono-list li:hover{border-color:var(--accent)}
.chrono-list li.dragging{opacity:.4}
.chrono-list li .num{background:var(--accent-soft);color:var(--accent);width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}

.mm-text{background:var(--surface-2);border-radius:8px;padding:16px;line-height:1.7;margin-bottom:14px}
.mm-thesis{padding:4px 6px;border-radius:6px;cursor:pointer;transition:.15s;display:block;margin:4px 0}
.mm-thesis:hover{background:var(--surface-3)}
.mm-thesis.selected{background:var(--accent-soft);border-left:3px solid var(--accent);padding-left:10px}
.mm-thesis.correct{background:rgba(74,222,128,.2);border-left:3px solid var(--success);padding-left:10px}
.mm-thesis.wrong{background:rgba(248,113,113,.2);border-left:3px solid var(--danger);padding-left:10px}
.mm-result{background:var(--surface-2);border-radius:8px;padding:16px;margin-top:12px;font-family:monospace;font-size:13px;white-space:pre;line-height:1.6;overflow:auto}

.fc-claim{background:var(--surface-2);border-radius:10px;padding:14px;margin-bottom:10px}
.fc-claim p{margin-bottom:10px;font-size:15px}
.fc-buttons{display:flex;gap:6px;flex-wrap:wrap}
.fc-buttons button{flex:1;min-width:100px;background:var(--surface-3);border:1px solid #2a3140;color:var(--text);padding:8px;border-radius:6px;cursor:pointer;font-size:13px;font-family:inherit;transition:.15s}
.fc-buttons button:hover{border-color:var(--accent)}
.fc-buttons button.chosen{border-color:var(--accent);background:var(--accent-soft)}
.fc-buttons button.correct{border-color:var(--success);background:rgba(74,222,128,.15)}
.fc-buttons button.wrong{border-color:var(--danger);background:rgba(248,113,113,.15)}

.st-item{background:var(--surface-2);border-radius:10px;padding:14px;margin-bottom:10px}
.st-buttons{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.st-buttons button{flex:1;min-width:100px;background:var(--surface-3);border:1px solid #2a3140;color:var(--text);padding:8px;border-radius:6px;cursor:pointer;font-size:13px;font-family:inherit}
.st-buttons button:hover{border-color:var(--accent)}
.st-buttons button.chosen{border-color:var(--accent);background:var(--accent-soft)}
.st-buttons button.correct{border-color:var(--success);background:rgba(74,222,128,.15)}
.st-buttons button.wrong{border-color:var(--danger);background:rgba(248,113,113,.15)}

.man-item{background:var(--surface-2);border-radius:10px;padding:14px;margin-bottom:10px}
.man-text{background:var(--surface-3);border-left:3px solid var(--danger);padding:10px;border-radius:6px;margin:8px 0;font-style:italic}
.man-options{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px;margin-top:8px}
.man-options button{background:var(--surface-3);border:1px solid #2a3140;color:var(--text);padding:8px;border-radius:6px;cursor:pointer;font-size:13px;font-family:inherit;text-align:left}
.man-options button:hover{border-color:var(--accent)}
.man-options button.chosen{border-color:var(--accent);background:var(--accent-soft)}
.man-options button.correct{border-color:var(--success);background:rgba(74,222,128,.15)}
.man-options button.wrong{border-color:var(--danger);background:rgba(248,113,113,.15)}

.noise-list{list-style:none;margin:14px 0}
.noise-item{background:var(--surface-2);border:1px solid #2a3140;border-radius:8px;padding:10px 14px;margin-bottom:8px;display:flex;gap:10px;align-items:center;cursor:pointer;transition:.15s}
.noise-item:hover{border-color:var(--accent)}
.noise-item.selected{background:var(--accent-soft);border-color:var(--accent)}
.noise-item.correct{background:rgba(74,222,128,.15);border-color:var(--success)}
.noise-item.wrong{background:rgba(248,113,113,.15);border-color:var(--danger)}
.noise-item .checkbox{width:20px;height:20px;border:2px solid #2a3140;border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px}
.noise-item.selected .checkbox{background:var(--accent);border-color:var(--accent);color:#fff}

.wiki-text{background:var(--surface-2);border-radius:8px;padding:16px;line-height:1.7;margin-bottom:14px}
.wiki-sentence{padding:4px 6px;border-radius:4px;cursor:pointer;display:block;margin:4px 0;transition:.15s}
.wiki-sentence:hover{background:var(--surface-3)}
.wiki-sentence.selected{background:rgba(248,113,113,.25);border-left:3px solid var(--danger);padding-left:10px}
.wiki-sentence.correct{background:rgba(74,222,128,.2);border-left:3px solid var(--success);padding-left:10px}
.wiki-sentence.wrong{background:rgba(248,113,113,.15);border-left:3px solid var(--danger);padding-left:10px}

.history-table{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
.history-table th,.history-table td{text-align:left;padding:8px 10px;border-bottom:1px solid #232735}
.history-table th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.history-table tr:hover{background:var(--surface-2)}
.history-table .score{font-weight:700}
.history-table .good{color:var(--success)}
.history-table .mid{color:var(--warn)}
.history-table .bad{color:var(--danger)}
.history-empty{color:var(--muted);font-style:italic;padding:16px 0}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
.modal{background:var(--surface);border:1px solid #232735;border-radius:var(--radius);padding:26px;max-width:420px;width:100%}
.modal h2{margin-bottom:8px}
.modal input{margin-top:12px}
.modal .actions{display:flex;gap:8px;margin-top:14px}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:14px}
.stat-card{background:var(--surface-2);border-radius:10px;padding:14px;text-align:center}
.stat-card .num{font-size:24px;font-weight:700;color:var(--accent)}
.stat-card .num.good{color:var(--success)}
.stat-card .num.bad{color:var(--danger)}
.stat-card .lbl{font-size:12px;color:var(--muted);margin-top:4px}

/* Расширенная теория */
.theory-intro{font-size:15px;line-height:1.7;color:var(--text);background:var(--surface-2);border-left:3px solid var(--accent);padding:12px 16px;border-radius:0 8px 8px 0;margin-bottom:20px}
.theory-subtitle{font-size:16px;font-weight:700;margin:20px 0 10px;color:var(--text)}
.theory-section{margin:18px 0;padding:16px 18px;background:var(--surface-2);border-radius:10px;border:1px solid #232735}
.theory-section.tips{background:rgba(91,140,255,.06);border-color:rgba(91,140,255,.25)}
.theory-section.mistakes{background:rgba(251,191,36,.06);border-color:rgba(251,191,36,.25)}
.theory-section.it{background:rgba(74,222,128,.06);border-color:rgba(74,222,128,.25)}
.theory-section .theory-subtitle{margin-top:0}
.theory-body{font-size:14.5px;line-height:1.7;color:var(--text)}
.theory-body p{margin-bottom:10px}
.theory-body p:last-child{margin-bottom:0}
.theory-list{list-style:none;padding:0}
.theory-list li{position:relative;padding:6px 0 6px 22px;font-size:14.5px;line-height:1.6}
.theory-list li::before{content:'›';position:absolute;left:6px;top:5px;color:var(--accent);font-weight:700;font-size:16px}

/* === Новые модули === */
.reverseSearch .search-results{list-style:none;margin:14px 0}
.reverseSearch .search-results li{background:var(--surface-2);border:1px solid #2a3140;border-radius:8px;padding:10px 14px;margin-bottom:6px;font-size:14px}
.reverseSearch .search-results li .url{color:var(--success);font-size:12px;font-family:monospace}
.reverseSearch .search-results li .title{color:var(--accent);font-weight:600}

.ref-source{background:var(--surface-2);border-radius:10px;padding:16px;margin-bottom:14px;line-height:1.7;font-size:14.5px;max-height:340px;overflow:auto}
.ref-blocks{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;margin:14px 0}
.ref-block{background:var(--surface-2);border:1px solid #2a3140;border-radius:8px;padding:10px 14px;cursor:pointer;font-size:14px;transition:.15s}
.ref-block:hover{border-color:var(--accent)}
.ref-block.selected{background:var(--accent-soft);border-color:var(--accent)}
.ref-block.correct{background:rgba(74,222,128,.15);border-color:var(--success)}
.ref-block.wrong{background:rgba(248,113,113,.15);border-color:var(--danger)}
.ref-block .rb-num{background:var(--accent-soft);color:var(--accent);width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-right:8px}

.logic-item{background:var(--surface-2);border-radius:10px;padding:14px;margin-bottom:10px}
.logic-text{background:var(--surface-3);border-left:3px solid var(--warn);padding:10px;border-radius:6px;margin:8px 0;font-style:italic}
.logic-options{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px;margin-top:8px}
.logic-options button{background:var(--surface-3);border:1px solid #2a3140;color:var(--text);padding:8px;border-radius:6px;cursor:pointer;font-size:13px;font-family:inherit;text-align:left}
.logic-options button:hover{border-color:var(--accent)}
.logic-options button.chosen{border-color:var(--accent);background:var(--accent-soft)}

const Storage = {
  KEY:'infalab_v6_state',
  USER_KEY:'infalab_v6_user',
  defaultState(){
    return {
      xp:0, theory:{}, practice:{}, badges:[],
      stats:{ correct:0, wrong:0, totalAttempts:0, scores:[] },
      history:[],
      createdAt: Date.now(),
    };
  },
  load(){
    try { const r = localStorage.getItem(this.KEY); return r ? JSON.parse(r) : this.defaultState(); }
    catch { return this.defaultState(); }
  },
  save(s){ localStorage.setItem(this.KEY, JSON.stringify(s)); },
  reset(){ localStorage.removeItem(this.KEY); },
  getUser(){ try { return JSON.parse(localStorage.getItem(this.USER_KEY) || 'null'); } catch { return null; } },
  setUser(u){ localStorage.setItem(this.USER_KEY, JSON.stringify(u)); }
};

   3. PROGRESS / STATS / HISTORY
   ============================================================ */

const Progress = {
  LEVELS:[
    { name:'Новичок', xp:0 },
    { name:'Аналитик', xp:200 },
    { name:'Исследователь', xp:500 },
    { name:'Инфо-инженер', xp:1000 },
    { name:'Мастер информации', xp:2000 },
  ],
  addXP(amount, reason=''){
    if (amount <= 0) return;
    const s = Storage.load();
    s.xp += amount;
    Storage.save(s);
    this.updateBadge();
    this.toast(`+${amount} XP${reason?' — '+reason:''}`);
    this.checkLevelBadges();
  },
  levelInfo(xp){
    let idx = 0;
    this.LEVELS.forEach((l,i)=>{ if (xp >= l.xp) idx = i; });
    const current = this.LEVELS[idx];
    const next = this.LEVELS[idx+1] || null;
    const progress = next ? Math.round(((xp-current.xp)/(next.xp-current.xp))*100) : 100;
    return { current, next, progress, index: idx };
  },
  updateBadge(){
    const s = Storage.load();
    const el = document.getElementById('xp-value');
    if (el) el.textContent = s.xp;
  },
  toast(text){
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = text;
    document.body.appendChild(t);
    setTimeout(()=>t.remove(), 2400);
  },
  checkLevelBadges(){
    const s = Storage.load();
    if (s.xp >= 200 && !s.badges.includes('level_up')){
      s.badges.push('level_up'); Storage.save(s);
      this.toast('🏅 Бейдж: Аналитик (200 XP)');
    }
  }
};

const Stats = {
  record(correctCount, wrongCount, score){
    const s = Storage.load();
    s.stats.correct += correctCount;
    s.stats.wrong += wrongCount;
    s.stats.totalAttempts += 1;
    if (typeof score === 'number') s.stats.scores.push(score);
    Storage.save(s);
    if (score === 100 && !s.badges.includes('perfect')){
      s.badges.push('perfect'); Storage.save(s);
      Progress.toast('🏅 Бейдж: Перфекционист');
    }
  },
  summary(){
    const s = Storage.load();
    const st = s.stats;
    const total = st.correct + st.wrong;
    const avg = st.scores.length ? Math.round(st.scores.reduce((a,b)=>a+b,0)/st.scores.length) : 0;
    return {
      correct: st.correct, wrong: st.wrong, total,
      accuracy: total ? Math.round((st.correct/total)*100) : 0,
      attempts: st.totalAttempts, avgScore: avg,
    };
  },
  reset(){
    const s = Storage.load();
    s.stats = { correct:0, wrong:0, totalAttempts:0, scores:[] };
    Storage.save(s);
  }
};

const History = {
  add(moduleId, moduleName, score, correct, wrong, timeSpent, maxTime){
    const s = Storage.load();
    s.history.push({
      date: Date.now(),
      moduleId, moduleName, score, correct, wrong,
      timeSpent: Math.round(timeSpent),
      maxTime,
      timeout: timeSpent >= maxTime - 1,
    });
    if (s.history.length > 300) s.history = s.history.slice(-300);
    Storage.save(s);
    const today = new Date().setHours(0,0,0,0);
    const todayAttempts = s.history.filter(h => h.date >= today).length;
    if (todayAttempts >= 10 && !s.badges.includes('marathon')){
      s.badges.push('marathon'); Storage.save(s);
      Progress.toast('🏅 Бейдж: Марафонец');
    }
    if (timeSpent < 30 && !s.badges.includes('speedrun')){
      s.badges.push('speedrun'); Storage.save(s);
      Progress.toast('🏅 Бейдж: Скоростной');
    }
  },
  list(){ return Storage.load().history.slice().reverse(); },
  clear(){ const s = Storage.load(); s.history = []; Storage.save(s); }
};

const Timer = {
  create(seconds, onExpire){
    const el = document.createElement('div');
    el.className = 'timer';
    el.innerHTML = `<span class="icon">⏱</span> <span class="time">${seconds}с</span>`;
    const timeSpan = el.querySelector('.time');
    const start = Date.now();
    let expired = false;
    const interval = setInterval(()=>{
      const elapsed = (Date.now() - start) / 1000;
      const left = Math.max(0, seconds - elapsed);
      timeSpan.textContent = Math.ceil(left) + 'с';
      el.classList.toggle('warn', left <= 20 && left > 10);
      el.classList.toggle('danger', left <= 10);
      if (left <= 0 && !expired){
        expired = true;
        clearInterval(interval);
        onExpire && onExpire();
      }
    }, 200);
    return {
      element: el,
      elapsed: () => (Date.now() - start) / 1000,
      stop: () => clearInterval(interval),
      expired: () => expired,
    };
  }
};

          <div class="cards">

                  <div class="flip-front">${c.term}</div>

    }).join('');

      <h1>Теория</h1>
      <p class="muted" style="margin-bottom:14px">6 модулей · ${THEORY_DATA.modules.reduce((n,m)=>n+m.cards.length,0)} карточек · развёрнутые пояснения, советы и примеры из IT.</p>

    `;
  },
  renderSection(sec){
    if (sec.type === 'text') return `<div class="theory-section"><h3 class="theory-subtitle">${sec.title}</h3><div class="theory-body">${this.formatBody(sec.body)}</div></div>`;
    if (sec.type === 'tips') return `<div class="theory-section tips"><h3 class="theory-subtitle">💡 ${sec.title}</h3><ul class="theory-list">${sec.items.map(i=>`<li>${i}</li>`).join('')}</ul></div>`;

    return '';

  formatBody(text){
    return text.split('\n\n').map(par => `<p>${par.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\n/g,'<br>')}</p>`).join('');
  },
  bind(){
    document.querySelectorAll('.flip-card').forEach(c=>{
      c.addEventListener('click', ()=>c.classList.toggle('flipped'));
    });
    document.querySelectorAll('[data-quiz]').forEach(btn=>{

    const search = document.getElementById('theory-search');
    if (search) search.addEventListener('input', ()=>this.filter(search.value));
    document.querySelectorAll('.theory-module').forEach(mod=>{
      const id = mod.dataset.id;
      let marked = false;
      const markRead = ()=>{
        if (marked) return;
        marked = true;
        const s = Storage.load();
        s.theory[id] = { ...(s.theory[id]||{}), read: true };
        Storage.save(s);
        if (!mod.querySelector('.badge-done')){
          const span = document.createElement('span');
          span.className = 'badge-done';
          span.textContent = '✓ изучено';
          mod.querySelector('.module-head > div').prepend(span);
        }
        this.checkTheoryBadges();
      };
      const timer = setTimeout(markRead, 40000);
      mod.addEventListener('mouseleave', ()=>clearTimeout(timer), { once:true });
      mod.querySelector('[data-quiz]')?.addEventListener('click', ()=>clearTimeout(timer));
    });
  },
  filter(query){
    const q = query.toLowerCase().trim();
    document.querySelectorAll('.theory-module').forEach(mod=>{
      if (!q){ mod.style.display = ''; return; }
      const text = mod.textContent.toLowerCase();
      mod.style.display = text.includes(q) ? '' : 'none';
    });
  },
  checkTheoryBadges(){
    const s = Storage.load();
    const done = Object.values(s.theory).filter(x=>x.read).length;
    const newBadges = [];
    if (done >= 1 && !s.badges.includes('first_theory')) newBadges.push('first_theory');
    if (done >= 3 && !s.badges.includes('half_theory'))  newBadges.push('half_theory');
    if (done >= 6 && !s.badges.includes('all_theory'))   newBadges.push('all_theory');
    if (newBadges.length){
      s.badges.push(...newBadges);
      Storage.save(s);
      newBadges.forEach(b=>{
        const bd = BADGES.find(x=>x.id===b);
        Progress.toast(`🏅 Бейдж: ${bd.name}`);
      });
    }
  },
  openQuiz(id){
    const zone = document.querySelector(`[data-zone="${id}"]`);
    const quiz = QUIZZES[id] || [];
    if (!quiz.length || zone.dataset.open === '1') return;
    zone.dataset.open = '1';
    zone.innerHTML = `
      <div class="quiz-block">
        <h3>Мини-квиз · ${quiz.length} вопросов</h3>
        <div id="quiz-timer-${id}"></div>
        ${quiz.map((q,qi)=>`
          <div class="quiz-q">
            <p><b>${qi+1}. ${q.q}</b></p>
            ${q.options.map((o,oi)=>`<label><input type="radio" name="q${id}_${qi}" value="${oi}"> ${o}</label>`).join('')}
          </div>
        `).join('')}
        <button class="btn" id="quiz-submit-${id}">Проверить</button>
        <div id="quiz-result-${id}"></div>
      </div>
    `;
    const MAX = 90;
    const timer = Timer.create(MAX, ()=>document.getElementById(`quiz-submit-${id}`)?.click());
    document.getElementById(`quiz-timer-${id}`).appendChild(timer.element);

    document.getElementById(`quiz-submit-${id}`).addEventListener('click', ()=>{
      if (zone.dataset.done === '1') return;
      zone.dataset.done = '1';
      timer.stop();
      const timeSpent = Math.min(timer.elapsed(), MAX);
      let correct = 0;
      quiz.forEach((q,qi)=>{
        const sel = document.querySelector(`input[name="q${id}_${qi}"]:checked`);
        if (sel && +sel.value === q.correct) correct++;
      });
      const wrong = quiz.length - correct;
      const score = Math.round((correct/quiz.length)*100);
      const cls = score>=80?'good':score>=50?'mid':'bad';
      document.getElementById(`quiz-result-${id}`).innerHTML = `
        <div class="result">
          <div class="score-big ${cls}">${score}%</div>
          <p>Правильно: ${correct} из ${quiz.length}</p>
          <p class="muted" style="font-size:13px">Время: ${timeSpent.toFixed(1)} с</p>
        </div>
      `;
      const s = Storage.load();
      s.theory[id] = { ...(s.theory[id]||{}), read: true, quizScore: Math.max(s.theory[id]?.quizScore||0, score) };
      Storage.save(s);
      this.checkTheoryBadges();
      Stats.record(correct, wrong, score);
      History.add(id, 'Теория: ' + id, score, correct, wrong, timeSpent, MAX);
      Progress.addXP(Math.round(score/10), 'Квиз по теории');
    });
  }
};

function quickRecord(moduleId, moduleName, score, correct, wrong, timeSpent, maxTime){
  const s = Storage.load();
  const prev = s.practice[moduleId]?.score || 0;
  s.practice[moduleId] = { score: Math.max(prev, score), attempts: (s.practice[moduleId]?.attempts||0)+1 };
  Storage.save(s);
  Stats.record(correct, wrong, score);
  History.add(moduleId, moduleName, score, correct, wrong, timeSpent, maxTime);
  Progress.addXP(Math.max(2, Math.round(score/10)), moduleName);
  SearchTrainer.checkPracticeBadges();
}

  render(stage){
    this.current = SEARCH_TASKS[Math.floor(Math.random()*SEARCH_TASKS.length)];
    this.done = false;
    stage.innerHTML = `
      <div class="trainer">

        <div id="timer-zone"></div>

    document.querySelectorAll('[data-op]').forEach(c=>{
      c.addEventListener('click', ()=>{

        inp.value += (inp.value.endsWith(' ')?'':' ') + c.dataset.op;
        inp.focus();
      });
    });
    const MAX = 90;

    document.getElementById('check-query').addEventListener('click', ()=>this.check());
    document.getElementById('query-input').addEventListener('keypress', e=>{ if (e.key === 'Enter') this.check(); });
  },
  check(){
    if (this.done) return; this.done = true;
    this.timer.stop();
    const timeSpent = Math.min(this.timer.elapsed(), this.maxTime);
    const query = document.getElementById('query-input').value.toLowerCase().trim();
    const t = this.current;
    let score = 0; const fb = []; let correct = 0, wrong = 0;
    t.keywords.forEach(kw=>{
      if (query.includes(kw)){ score += 10; correct++; fb.push(`✓ «${kw}»`); }
      else { wrong++; fb.push(`✗ потеряно «${kw}»`); }
    });
    (t.operators||[]).forEach(op=>{
      if (query.includes(op)){ score += 20; correct++; fb.push(`✓ оператор ${op}`); }
      else { wrong++; fb.push(`✗ нужен ${op}`); }
    });
    (t.forbidden||[]).forEach(bad=>{
      if (query.includes(bad)){ score -= 5; wrong++; fb.push(`✗ лишнее «${bad}»`); }
    });
    score = Math.max(0, Math.min(100, score));
    const cls = score>=80?'good':score>=50?'mid':'bad';
    document.getElementById('feedback').innerHTML = `
      <div class="result">
        <div class="score-big ${cls}">${score}%</div>
        <ul>${fb.map(x=>`<li>${x}</li>`).join('')}</ul>
        <p class="hint">Эталон: <code>${t.idealQuery}</code></p>
        <p class="muted" style="font-size:13px">Время: ${timeSpent.toFixed(1)} с</p>
      </div>
    `;
    quickRecord('search','Поисковый тренажёр',score,correct,wrong,timeSpent,this.maxTime);
    if (Storage.load().practice.search.score >= 80 && !Storage.load().badges.includes('search_master')){
      const s = Storage.load(); s.badges.push('search_master'); Storage.save(s);
      Progress.toast('🏅 Бейдж: Мастер поиска');
    }
  },
  checkPracticeBadges(){
    const s = Storage.load();
    const ids = getAllPracticeIds();
    const done = ids.filter(k=>s.practice[k]?.score != null).length;
    const newBadges = [];
    if (done >= 1 && !s.badges.includes('first_practice')) newBadges.push('first_practice');
    if (done >= ids.length && !s.badges.includes('all_practice')) newBadges.push('all_practice');
    if (newBadges.length){
      s.badges.push(...newBadges); Storage.save(s);
      newBadges.forEach(b=>{
        const bd = BADGES.find(x=>x.id===b);
        Progress.toast(`🏅 Бейдж: ${bd.name}`);
      });
    }
  }
};

const SourceDetective = {
  render(stage){
    this.current = SOURCE_SETS[Math.floor(Math.random()*SOURCE_SETS.length)];
    this.done = false;
    const shuffled = [...this.current.sources].sort(()=>Math.random()-0.5);
    stage.innerHTML = `
      <div class="detective">
        <h3>🕵️ Детектив источников</h3>
        <div id="timer-zone"></div>
        <p class="task-text">Тема: <b>${this.current.topic}</b></p>
        <p class="muted" style="margin-bottom:10px">Перетащи источники от надёжного к ненадёжному.</p>
        <ul class="sources" id="sources-list">
          ${shuffled.map(s=>`<li draggable="true" data-id="${s.id}"><span class="handle">⋮⋮</span><div><div class="src-title">${s.title}</div><div class="src-meta">${s.meta}</div></div></li>`).join('')}
        </ul>
        <button class="btn" id="check-sources">Проверить</button>
        <div id="feedback"></div>
      </div>
    `;
    const MAX = 120;
    this.timer = Timer.create(MAX, ()=>document.getElementById('check-sources')?.click());
    document.getElementById('timer-zone').appendChild(this.timer.element);
    this.maxTime = MAX;
    this.enableDnD();
    document.getElementById('check-sources').addEventListener('click', ()=>this.check());
  },
  enableDnD(){
    const list = document.getElementById('sources-list');
    let dragged = null;
    list.addEventListener('dragstart', e=>{ dragged = e.target.closest('li'); if (dragged) dragged.classList.add('dragging'); });
    list.addEventListener('dragend', ()=>{ dragged?.classList.remove('dragging'); dragged = null; });
    list.addEventListener('dragover', e=>{
      e.preventDefault();
      if (!dragged) return;
      const after = this.getDragAfter(list, e.clientY);
      if (after == null) list.appendChild(dragged);
      else list.insertBefore(dragged, after);
    });
  },
  getDragAfter(container, y){
    const items = [...container.querySelectorAll('li:not(.dragging)')];
    return items.reduce((closest, child)=>{
      const box = child.getBoundingClientRect();
      const offset = y - box.top - box.height/2;
      if (offset < 0 && offset > closest.offset) return { offset, element: child };
      return closest;
    }, { offset: -Infinity, element: null }).element;

        <div id="timer-zone"></div>
        <p class="task-text">${this.current.title}</p>
        <ul class="chrono-list" id="chrono-list">
          ${shuffled.map(it=>`<li draggable="true" data-id="${it.id}"><span class="num">?</span><span>${it.text}</span></li>`).join('')}
        </ul>
        <button class="btn" id="check-chrono">Проверить</button>
        <button class="btn btn-ghost" id="next-chrono" style="margin-left:8px">Другое</button>
        <div id="feedback"></div>
      </div>
    `;
    const MAX = 90;
    this.timer = Timer.create(MAX, ()=>document.getElementById('check-chrono')?.click());
    document.getElementById('timer-zone').appendChild(this.timer.element);
    this.maxTime = MAX;
    this.enableDnD();
    document.getElementById('check-chrono').addEventListener('click', ()=>this.check());
    document.getElementById('next-chrono').addEventListener('click', ()=>{ this.done=false; this.render(stage); });
  },
  enableDnD(){
    const list = document.getElementById('chrono-list');
    let dragged = null;
    list.addEventListener('dragstart', e=>{ dragged = e.target.closest('li'); if (dragged) dragged.classList.add('dragging'); });
    list.addEventListener('dragend', ()=>{ dragged?.classList.remove('dragging'); dragged = null; });
    list.addEventListener('dragover', e=>{
      e.preventDefault();
      if (!dragged) return;
      const after = this.getAfter(list, e.clientY);
      if (after == null) list.appendChild(dragged);
      else list.insertBefore(dragged, after);
    });
  },
  getAfter(container, y){
    const items = [...container.querySelectorAll('li:not(.dragging)')];
    return items.reduce((closest, child)=>{
      const box = child.getBoundingClientRect();
      const offset = y - box.top - box.height/2;
      if (offset < 0 && offset > closest.offset) return { offset, element: child };
      return closest;
    }, { offset: -Infinity, element: null }).element;
  },
  check(){
    if (this.done) return; this.done = true;
    this.timer.stop();
    const timeSpent = Math.min(this.timer.elapsed(), this.maxTime);
    const order = [...document.querySelectorAll('#chrono-list li')].map(li=>li.dataset.id);
    let correct = 0, wrong = 0;
    order.forEach((id,i)=>{
      const li = document.querySelector(`#chrono-list li[data-id="${id}"]`);
      const num = li.querySelector('.num');
      if (id === this.correctOrder[i]){ num.textContent = i+1; num.style.background = 'var(--success)'; num.style.color = '#0a1a0f'; correct++; }

    document.getElementById('timer-zone').appendChild(this.timer.element);

        document.querySelectorAll(`[data-i="${i}"]`).forEach(b=>b.classList.remove('chosen'));
        btn.classList.add('chosen');
        this.answers[i] = btn.dataset.value;
      });

  check(){
    if (this.done) return; this.done = true;
    this.timer.stop();
    const timeSpent = Math.min(this.timer.elapsed(), this.maxTime);
    let correct = 0, wrong = 0;
    this.items.forEach((it,i)=>{
      const chosen = this.answers[i];
      document.querySelectorAll(`[data-i="${i}"]`).forEach(b=>{
        b.classList.remove('chosen');
        if (b.dataset.value === it.type) b.classList.add('correct');
        if (b.dataset.value === chosen && chosen !== it.type) b.classList.add('wrong');
      });
      if (chosen === it.type) correct++; else wrong++;
    });
    const score = Math.round((correct/this.items.length)*100);
    const cls = score>=80?'good':score>=50?'mid':'bad';
    document.getElementById('feedback').innerHTML = `
      <div class="result">
        <div class="score-big ${cls}">${score}%</div>
        <p>Правильно: ${correct} / ${this.items.length}</p>
      </div>
    `;

  }
};

  renderQuestion(stage){

    const content = document.getElementById('ta-content');
    content.innerHTML = `

      Progress.toast('Данные сохранены');
    });
    document.getElementById('user-cancel')?.addEventListener('click', ()=>overlay.remove());
  },
  init(){
    this.refresh();
    if (!Storage.getUser()) this.openModal(false);
    document.getElementById('user-name-btn').addEventListener('click', ()=>this.openModal(true));
  }
};

/* ============================================================
   8. ОТЧЁТ
   ============================================================ */

const Report = {
  generate(){
    const s = Storage.load();
    const user = Storage.getUser() || { name:'Не указано', group:'' };
    const lvl = Progress.levelInfo(s.xp);
    const sum = Stats.summary();
    const history = History.list();
    const practiceNames = {
      search:'Поисковый тренажёр', detective:'Детектив источников', citation:'Конструктор ссылок',
      craap:'CRAAP-анализ', textsearch:'Поиск по тексту', imganalysis:'Анализ изображений',
      licenses:'Лицензии', plagiarism:'Плагиат', factopinion:'Факты и мнения',
      chronology:'Хронология', mindmap:'Mind-map', factcheck:'Фактчекинг',
      sourceType:'Тип источника', manipulation:'Манипуляции', noise:'Информационный шум',
      wikiEditor:'Вики-редактор', reverseSearch:'Реверс-инжиниринг', abstract:'Реферирование',
      logicErrors:'Логические ошибки', correlation:'Корреляция', refManager:'Менеджер ссылок',
      rfcReader:'Чтение RFC', redFlags:'Красные флаги', compareSources:'Сравнение источников',
      examMode:'Экзамен', timeAttack:'Тайм-атака'
    };
    const theoryRows = THEORY_DATA.modules.map(m=>{
      const t = s.theory[m.id] || {};
      return `<tr><td>${m.title}</td><td>${t.read?'✓':'—'}</td><td>${t.quizScore!=null?t.quizScore+'%':'—'}</td></tr>`;
    }).join('');
    const practiceRows = Object.keys(practiceNames).map(k=>{
      const p = s.practice[k] || {};
      return `<tr><td>${practiceNames[k]}</td><td>${p.score!=null?p.score+'%':'—'}</td><td>${p.attempts||0}</td></tr>`;
    }).join('');
    const theoryDone = Object.values(s.theory).filter(x=>x.read).length;
    const practiceDone = Object.keys(practiceNames).filter(k=>s.practice[k]?.score != null).length;
    const totalItems = THEORY_DATA.modules.length + Object.keys(practiceNames).length;
    const overall = Math.round(((theoryDone + practiceDone) / totalItems) * 100);
    const badgesList = BADGES.filter(b=>s.badges.includes(b.id))
      .map(b=>`<li>${b.emoji} <b>${b.name}</b> — ${b.desc}</li>`).join('') || '<li class="muted">Пока нет бейджей</li>';
    const historyRows = history.slice(0,30).map(h=>{
      const d = new Date(h.date);
      const dateStr = d.toLocaleString('ru-RU');
      const cls = h.score>=80?'good':h.score>=50?'mid':'bad';
      return `<tr>
        <td>${dateStr}</td>
        <td>${h.moduleName}${h.timeout?' ⏰':''}</td>
        <td class="${cls}"><b>${h.score}%</b></td>
        <td>${h.timeSpent}с / ${h.maxTime}с</td>
        <td>${h.correct}✓ / ${h.wrong}✗</td>
      </tr>`;
    }).join('');
    const date = new Date().toLocaleString('ru-RU');

    const win = window.open('', '_blank');
    win.document.write(`
      <!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8">
      <title>Отчёт ИнфоЛаб — ${user.name}</title>
      <style>
        body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#111;max-width:850px;margin:30px auto;padding:0 20px;line-height:1.5}
        h1{border-bottom:2px solid #333;padding-bottom:8px;margin-bottom:16px}
        h2{margin-top:24px;border-bottom:1px solid #ddd;padding-bottom:4px}
        table{width:100%;border-collapse:collapse;margin:12px 0;font-size:12px}
        th,td{text-align:left;padding:5px 8px;border-bottom:1px solid #eee}
        th{background:#f5f5f5}
        .box{background:#f9f9f9;padding:14px;border-radius:8px;margin:14px 0;border:1px solid #eee}
        ul{padding-left:20px}
        .footer{margin-top:40px;font-size:12px;color:#777;border-top:1px solid #ddd;padding-top:10px}
        .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
        .stat{background:#f0f4ff;border:1px solid #d0dcff;border-radius:8px;padding:12px;text-align:center}
        .stat .n{font-size:22px;font-weight:700;color:#5b8cff}
        .stat .l{font-size:11px;color:#555;margin-top:2px}
        .signature{margin-top:40px;display:flex;justify-content:space-between;font-size:13px;color:#333}
        .signature div{flex:1}
        .line{border-bottom:1px solid #999;height:20px;margin-bottom:4px}
        .good{color:#16a34a}
        .mid{color:#d97706}
        .bad{color:#dc2626}
        @media print { body{margin:0} .no-print{display:none} .stats-grid,.signature{page-break-inside:avoid} h2{page-break-after:avoid} }
      </style></head><body>
      <h1>🧠 ИнфоЛаб — отчёт о работе</h1>
      <p><b>Дисциплина:</b> Основы работы с информацией</p>
      <p><b>Студент:</b> ${user.name}${user.group ? ' · группа ' + user.group : ''}</p>
      <p><b>Дата формирования:</b> ${date}</p>

      <h2>Общий результат</h2>
      <div class="box">
        <p><b>Уровень:</b> ${lvl.current.name} · <b>XP:</b> ${s.xp}</p>
        <p><b>Общий прогресс дисциплины:</b> ${overall}%</p>
        <p><b>Модулей теории:</b> ${theoryDone} / ${THEORY_DATA.modules.length}</p>
        <p><b>Практик:</b> ${practiceDone} / ${Object.keys(practiceNames).length}</p>
      </div>

      <h2>Счётчик ответов</h2>
      <div class="stats-grid">
        <div class="stat"><div class="n">${sum.correct}</div><div class="l">Правильных</div></div>
        <div class="stat"><div class="n">${sum.wrong}</div><div class="l">Неправильных</div></div>
        <div class="stat"><div class="n">${sum.accuracy}%</div><div class="l">Точность</div></div>
        <div class="stat"><div class="n">${sum.avgScore}%</div><div class="l">Средний балл</div></div>
      </div>
      <p style="font-size:13px;color:#555">Всего попыток: ${sum.attempts} · Всего ответов: ${sum.total}</p>

      <h2>Теория</h2>
      <table><thead><tr><th>Модуль</th><th>Изучен</th><th>Квиз</th></tr></thead><tbody>${theoryRows}</tbody></table>

      <h2>Практика</h2>
      <table><thead><tr><th>Модуль</th><th>Лучший результат</th><th>Попыток</th></tr></thead><tbody>${practiceRows}</tbody></table>

      <h2>Достижения</h2>
      <ul>${badgesList}</ul>

      <h2>История попыток (последние 30 из ${history.length})</h2>
      ${history.length === 0
        ? '<p style="color:#777;font-style:italic">Нет попыток</p>'
        : `<table>
            <thead><tr><th>Дата</th><th>Модуль</th><th>Результат</th><th>Время</th><th>Ответы</th></tr></thead>
            <tbody>${historyRows}</tbody>
          </table>`}

      <div class="signature">
        <div><div class="line"></div><div>Подпись студента</div></div>
        <div style="margin-left:40px"><div class="line"></div><div>Подпись преподавателя</div></div>
      </div>

      <div class="footer">
        Отчёт сформирован автоматически в веб-приложении «ИнфоЛаб».
        Для сохранения в PDF: нажми «Печать» (Ctrl+P) и выбери «Сохранить как PDF».
      </div>

      <button class="no-print" onclick="window.print()" style="margin-top:20px;padding:10px 20px;background:#5b8cff;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:15px">🖨 Печать / Сохранить в PDF</button>
      </body></html>
    `);
    win.document.close();
  }
};

/* ============================================================
   9. APP
   ============================================================ */

const App = {
  currentView: 'home',
  views: {
    home:     { render: ()=>HomeView.render(),     bind: ()=>{} },
    theory:   { render: ()=>TheoryView.render(),   bind: ()=>TheoryView.bind() },
    practice: { render: ()=>PracticeView.render(), bind: ()=>PracticeView.bind() },
    profile:  { render: ()=>ProfileView.render(),  bind: ()=>ProfileView.bind() },
  },
  navigate(view){
    this.currentView = view;
    document.querySelectorAll('.tabs button').forEach(b=>{
      b.classList.toggle('active', b.dataset.view === view);
    });
    const main = document.getElementById('app');
    main.innerHTML = this.views[view].render();
    this.views[view].bind();
    window.scrollTo({ top:0, behavior:'smooth' });
  },
  init(){
    document.querySelectorAll('.tabs button').forEach(btn=>{
      btn.addEventListener('click', ()=>this.navigate(btn.dataset.view));
    });
    Progress.updateBadge();
    UserUI.init();
    this.navigate('home');
  }
};

document.addEventListener('DOMContentLoaded', ()=>App.init());
</script>
